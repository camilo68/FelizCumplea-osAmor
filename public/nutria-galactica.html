<title>Pingüino Galáctico</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Una huella que se escanea con el dedo, una galaxia que nace de ella, un pingüino guía y un final con explosión de partículas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

/* Concepto: un solo escenario WebGL a pantalla completa. Todas las partículas nacen de una huella, forman la galaxia, y al final estallan para formar un corazón. La interfaz es mínima y flota encima. */
@font-face{font-family:'Great Vibes';src:url('/fonts/great-vibes.woff2') format('woff2');font-weight:400;font-display:swap}
:root{
  --space-0:#05010b;
  --space-1:#14061f;
  --ink:#fff4f8;
  --ink-dim:#d9c3e6;
  --rose:#ff4d8d;
  --violet:#9b6bff;
  --paper:#fff4fa;
  --paper-ink:#3b1530;
  --glass:rgba(255,255,255,.09);
  --glass-line:rgba(255,255,255,.22);
  --font-ui:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --font-script:'Dancing Script','Great Vibes','Brush Script MT','Segoe Script',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--space-0);color:var(--ink);font-family:var(--font-ui);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 45%,#2a0f4d 0%,var(--space-1) 55%,var(--space-0) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* título final */
#brand{
  position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;z-index:5;pointer-events:none;
  font-family:var(--font-script);font-weight:700;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.1;letter-spacing:.01em;
  text-shadow:0 0 18px rgba(255,77,141,.9),0 0 44px rgba(255,77,141,.5);
  opacity:0;transform:translateY(-14px);transition:opacity 1.4s,transform 1.4s;
}
body.show-brand #brand{opacity:1;transform:none}

/* botones */
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:15px;font-weight:500;transition:transform .15s,background .2s,opacity .3s;
}
.chip:hover{background:rgba(255,255,255,.16)}
.chip:active{transform:scale(.95)}
#mute{position:fixed;z-index:35;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:44px;padding:0;justify-content:center;font-size:18px}
#bar{
  position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
#bar [hidden]{display:none}

/* globo del pingüino */
#bubble{
  position:fixed;left:0;top:0;z-index:15;width:min(344px,calc(100vw - 32px));padding:14px 18px 14px;border-radius:22px;
  background:var(--paper);color:var(--paper-ink);box-shadow:0 10px 44px rgba(255,77,141,.4);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s;will-change:transform;
}
#bubble.show{opacity:1;visibility:visible;pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#bubble::after{
  content:"";position:absolute;left:var(--tx,50%);bottom:-8px;width:18px;height:18px;background:var(--paper);
  transform:translateX(-50%) rotate(45deg);border-radius:3px;
}
#bubble .who{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#c2306b;margin-bottom:5px}
#bubble p{font-size:18px;line-height:1.42;min-height:2.84em;user-select:text;-webkit-user-select:text}
#bubble .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;min-height:38px}
.pill{
  min-height:38px;padding:0 16px;border-radius:999px;border:0;font-weight:600;font-size:15px;
  background:linear-gradient(135deg,#ff4d8d,#c2306b);color:#fff;box-shadow:0 4px 14px rgba(194,48,107,.45);
}
.pill.ghost{background:transparent;color:#8a4a6c;box-shadow:none}

/* escáner de huella */
#scan{position:fixed;inset:0;z-index:30;pointer-events:none;transition:opacity 1.2s,visibility 1.2s}
#scan.gone{opacity:0;visibility:hidden}
#scanTitle{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 26px);text-align:center;padding-inline:24px;
  font-family:var(--font-script);font-weight:700;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.1;text-wrap:balance;
  text-shadow:0 0 20px rgba(255,77,141,.9),0 0 48px rgba(255,77,141,.5);
}
#scanner{
  position:absolute;left:50%;top:50%;width:calc(var(--sw,300) * 1px);height:calc(var(--sh,400) * 1px);transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:auto;cursor:pointer;touch-action:none;border:1px dashed rgba(255,255,255,.28);
  transition:box-shadow .3s,border-color .3s;
}
#scanner.holding{border-color:rgba(255,120,170,.85);box-shadow:0 0 56px rgba(255,77,141,.5),inset 0 0 44px rgba(255,77,141,.2)}
#ringProg{
  position:absolute;inset:-7px;border-radius:50%;--p:0;pointer-events:none;
  background:conic-gradient(#ff6aa3 calc(var(--p) * 1%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  filter:drop-shadow(0 0 6px #ff4d8d);
}
#scanHint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center;padding-inline:24px;
  font-size:19px;line-height:1.4;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.7);
}
#scanHint small{display:block;font-size:14px;color:var(--ink-dim);margin-top:4px}
#scanFail{position:absolute;left:0;right:0;top:50%;text-align:center;padding-inline:24px;font-size:17px;color:var(--ink-dim)}

#flash{
  position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#fff 0%,rgba(255,170,210,.9) 32%,rgba(255,77,141,0) 75%);
}
#caption{
  position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);text-align:center;z-index:12;pointer-events:none;
  padding-inline:max(22px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-right,0px));
  font-family:var(--font-script);font-weight:700;font-size:clamp(1.6rem,5.2vw,2.5rem);line-height:1.2;text-wrap:balance;
  text-shadow:0 0 18px rgba(255,77,141,.95),0 0 40px rgba(255,77,141,.5);opacity:0;transition:opacity 1.8s;
}
#caption.show{opacity:1}

/* serenata */
#serenade{
  position:fixed;z-index:18;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);width:min(460px,calc(100vw - 38px));
  padding:14px 18px 12px;border-radius:22px;background:linear-gradient(160deg,rgba(32,9,48,.9),rgba(18,5,30,.74));
  border:1px solid var(--glass-line);box-shadow:0 14px 46px rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transform:translate(-50%,12px) scale(.97);text-align:center;opacity:0;visibility:hidden;transition:opacity .4s,transform .4s,visibility .4s;pointer-events:none;
}
#serenade.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
#serenade .songWho{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffc2dd;text-shadow:0 1px 10px rgba(0,0,0,.6)}
#lyricLine{
  font-family:var(--font-script);font-weight:700;font-size:clamp(1.5rem,5.6vw,2.45rem);line-height:1.22;min-height:2.44em;margin:6px 0 12px;
  color:#fff;text-shadow:0 0 18px rgba(255,77,141,.95),0 0 44px rgba(255,77,141,.55);transition:opacity .3s;
}
#songBars{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:22px;margin-bottom:10px}
#songBars i{display:block;width:4px;border-radius:3px;background:linear-gradient(#ff8ab8,#9b6bff);animation:bars .9s ease-in-out infinite;opacity:.85}
#songBars i:nth-child(2n){animation-delay:.15s}
#songBars i:nth-child(3n){animation-delay:.32s}
#songBars i:nth-child(4n){animation-delay:.46s}
#songStop{pointer-events:auto;background:rgba(255,255,255,.12);border:1px solid var(--glass-line);color:#fff;box-shadow:none}
@keyframes bars{0%,100%{height:5px}50%{height:22px}}

/* carta final */
#modal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,77,141,.2),rgba(5,1,11,.66) 68%);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:.4s;
}
#modal.open{opacity:1;visibility:visible}
.letter{
  position:relative;max-width:480px;width:100%;max-height:calc(100dvh - 36px);overflow:auto;padding:62px 30px 26px;border-radius:20px;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.85),transparent 46%),
    repeating-linear-gradient(0deg,rgba(180,110,140,.055) 0 1px,transparent 1px 28px),
    linear-gradient(160deg,#fffaf5,#ffeef6 55%,#ffe2ee);
  color:var(--paper-ink);border:1px solid rgba(224,36,94,.35);
  box-shadow:0 30px 90px rgba(0,0,0,.58),0 0 0 6px rgba(255,255,255,.05);
  transform:translateY(30px) scale(.94) rotateX(6deg);transform-origin:50% 100%;
  transition:transform .6s cubic-bezier(.2,.9,.25,1.15),opacity .5s;opacity:0;
}
#modal.open .letter{transform:none;opacity:1}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid rgba(224,36,94,.16);border-radius:14px;pointer-events:none}
.letter .seal{
  position:absolute;top:14px;left:50%;transform:translateX(-50%) rotate(-6deg);width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6a9f,#c21e56 60%,#8e123a);display:grid;place-items:center;
  color:#ffd9e7;font-size:19px;box-shadow:0 6px 18px rgba(142,18,58,.45),inset 0 0 0 2px rgba(255,255,255,.18);
}
.letterKicker{text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#b4547c;margin-bottom:4px}
.letter h2{font-family:var(--font-script);font-weight:700;font-size:2.75rem;text-align:center;margin-bottom:12px;color:#8e1f4b;text-shadow:0 1px 0 rgba(255,255,255,.8)}
#lText{white-space:pre-line;line-height:1.75;font-size:17px;text-align:center;min-height:7em;padding:0 6px;color:#4a1b36;outline:none;user-select:text;-webkit-user-select:text}
.sign{margin-top:18px;text-align:right;font-family:var(--font-script);font-size:1.9rem;line-height:1.05;color:#8e1f4b}
.sign span{display:block;font-size:2.3rem}
.letterActions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.letterActions .pill{font-size:14px;min-height:42px}
.letter small{display:block;margin-top:14px;text-align:center;color:#a26884;opacity:.8;font-size:12px}
#close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(142,31,75,.1);color:#8e1f4b;font-size:16px}
#close:hover{background:rgba(142,31,75,.18)}
@media (max-width:520px){
  #brand{font-size:clamp(1.7rem,7vw,2.6rem);padding-inline:54px;line-height:1.08}
  .letter{padding:58px 23px 22px;border-radius:18px}
  .letter .seal{top:10px;width:40px;height:40px;font-size:17px}
  .letter h2{font-size:2.35rem;margin-bottom:8px}
  #lText{font-size:16px;line-height:1.65;min-height:5em}
  .sign{font-size:1.7rem;margin-top:14px}
  .sign span{font-size:2rem}
  .letterActions{margin-top:14px}
  .letter small{margin-top:10px}
}
</style>

<h2 id="brand"></h2>

</div>

const COMMON = `
  uniform float uTime, uGalTime, uScale, uForm, uBoom, uProg, uScanY;
  attribute vec3 aMisc;   // x: tamaño, y: semilla, z: retraso de formación
  attribute vec3 aColor, aStart;
  varying vec3 vColor; varying float vAlpha;
  float ease(float t){ return t * t * (3.0 - 2.0 * t); }
  float h11(float n){ return fract(sin(n * 91.345) * 47453.5453); }
  vec3 run(vec3 fin, out float sz){

    float t = clamp((uForm - delay * 0.5) / 0.5, 0.0, 1.0), e = ease(t);
    vec3 d = fin - aStart;

    vec3 p = mix(aStart, fin, e) + side * sin(e * 3.14159) * (seed - 0.5) * 14.0;
    float b = 1.0 - pow(1.0 - uBoom, 3.0);
    vec3 dir = normalize(vec3(h11(seed * 13.1) - 0.5, h11(seed * 29.7) - 0.5, h11(seed * 57.3) - 0.5) + vec3(0.0001));
    vec3 radial = normalize(p + vec3(0.001));

    vec3 col = mix(vec3(1.0, 0.72, 0.88), aColor, e);

    vColor = col;
    float a0 = (mix(0.13, 0.46, uProg) + sc * 0.5) * (0.82 + 0.18 * sin(uTime * 2.0 + seed * 6.28));
    vAlpha = mix(a0, 0.95, e);
    float tw = 0.74 + 0.26 * sin(uTime * (1.1 + seed * 2.4) + seed * 31.0);
    vAlpha *= mix(1.0, tw, e);

const cometTmp = { fwd: new THREE.Vector3(), right: new THREE.Vector3(), up: new THREE.Vector3() };
function spawnComet(c) {
  const fwd = cometTmp.fwd, right = cometTmp.right, up = cometTmp.up;
  camera.getWorldDirection(fwd);
  right.crossVectors(fwd, camera.up).normalize();
  up.crossVectors(right, fwd).normalize();
  const side = Math.random() < 0.5 ? -1 : 1;
  const dist = 26 + Math.random() * 12;
  const halfH = Math.tan(camera.fov * Math.PI / 360) * dist, halfW = halfH * camera.aspect;
  c.start.copy(camera.position).addScaledVector(fwd, dist)
    .addScaledVector(right, side * (halfW + 4))
    .addScaledVector(up, halfH * 0.5 + Math.random() * halfH * 0.25);
  c.dir.copy(right).multiplyScalar(-side).addScaledVector(up, -0.32 - Math.random() * 0.22).normalize();
  c.travel = 1.25 + Math.random() * 0.75;
  c.speed = (halfW * 2.6) / c.travel;
  c.t = 0; c.active = true; c.g.visible = true;
}
function updateComets(dt, on) {
  comets.forEach(c => {

      c.wait -= dt;
      if (c.wait <= 0 && on > 0.5) spawnComet(c);
      return;
    }
    c.t += dt;
    const u = clamp(c.t / c.travel, 0, 1);
    const fade = smooth(0, 0.12, u) * (1 - smooth(0.72, 1, u));
    c.head.copy(c.start).addScaledVector(c.dir, c.speed * c.t);
    const trail = Math.min(9, Math.max(4.5, c.speed * 0.5));
    c.parts.forEach(s => {
      const k = s.userData.k;
      s.position.copy(c.head).addScaledVector(c.dir, -trail * k);
      s.material.opacity = fade * (1 - k * 0.82) * on * 0.9;
      s.scale.setScalar(s.userData.base * (0.8 + 0.2 * fade));
    });
    if (c.t >= c.travel) {
      c.active = false; c.g.visible = false;
      c.wait = 2.5 + Math.random() * 7;
    }
  });
}

const noteW = new THREE.Vector3();
function updateNotes(T, on) {
  noteSprites.forEach((s, i) => {
    if (!on) { s.material.opacity = 0; return; }
    const hp = otter.head.getWorldPosition(noteW);
    const t = (T * 0.34 + i / noteSprites.length) % 1;
    const a = i * 2.4 + T * 0.55, rad = 0.45 + t * 0.7;
    s.position.set(hp.x + Math.cos(a) * rad, hp.y + 0.55 + t * 1.5, hp.z + Math.sin(a) * rad * 0.6);
    s.material.opacity = Math.sin(t * Math.PI) * 0.95;
    s.scale.setScalar(0.5 + 0.28 * Math.sin(t * Math.PI));
  });
}

const phraseSprites = [];
function drawPhrase(c, text) {
  const x = c.getContext('2d');
  x.font = '600 64px Fredoka, "Segoe UI", system-ui, sans-serif';
  const w = Math.ceil(x.measureText(text).width) + 80;
  c.width = w; c.height = 120;
  x.font = '600 64px Fredoka, "Segoe UI", system-ui, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(255,90,160,.95)'; x.shadowBlur = 22; x.fillStyle = '#fff';
  x.fillText(text, w / 2, 62); x.fillText(text, w / 2, 62);
}
CONFIG.phrases.forEach((text, i) => {
  const c = document.createElement('canvas'); drawPhrase(c, text);
  const tex = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 }));
  s.userData = { i, text, c, tex, aspect: c.width / c.height };
  s.scale.set(s.userData.aspect * 1.7, 1.7, 1); scene.add(s); phraseSprites.push(s);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => phraseSprites.forEach(s => {

    s.userData.tex = new THREE.CanvasTexture(s.userData.c); s.material.map = s.userData.tex; s.material.needsUpdate = true;

}

function drawPolaroid(c, i, img) {
  c.width = 256; c.height = 320;
  const x = c.getContext('2d');
  x.shadowColor = 'rgba(255,100,170,.8)'; x.shadowBlur = 18;
  x.fillStyle = '#fff'; x.beginPath(); x.roundRect ? x.roundRect(12, 12, 232, 296, 12) : x.rect(12, 12, 232, 296); x.fill();
  x.shadowBlur = 0;
  const ix = 26, iy = 26, iw = 204, ih = 218;
  x.save(); x.beginPath(); x.rect(ix, iy, iw, ih); x.clip();
  if (img) {
    const k = Math.max(iw / img.width, ih / img.height), dw = img.width * k, dh = img.height * k;
    x.drawImage(img, ix + (iw - dw) / 2, iy + (ih - dh) / 2, dw, dh);
  } else {
    const cc = PH_COLORS[i % PH_COLORS.length], g = x.createLinearGradient(ix, iy, ix + iw, iy + ih);
    g.addColorStop(0, cc[0]); g.addColorStop(1, cc[1]); x.fillStyle = g; x.fillRect(ix, iy, iw, ih);
    x.font = '72px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#fff'; x.fillText('📷', ix + iw / 2, iy + ih / 2);
  }
  x.restore();
  x.fillStyle = '#d4558a'; x.font = '600 24px Fredoka, system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(img ? '♥' : 'tu foto', 128, 278);
}

}
function refreshPhotos() {
  photoSprites.forEach((s, i) => {
    s.visible = photos.length > 0;
    drawPolaroid(s.userData.c, i, photos.length ? photos[i % photos.length] : null); s.userData.tex.needsUpdate = true;
  });
}

/* S: unidades 3D por píxel de la referencia. AX y YC: columna del eje y fila central en esa imagen. */
const S=0.00638, AX=239.75, YC=304;
const BODY_Z=0.85;                                   /* profundidad del cuerpo respecto a su ancho */
const mag=z=>CAM_D/(CAM_D-z);                        /* aumento de perspectiva a la profundidad z */
const lift=(Y,z)=>(Y-CAM_Y)/mag(z)+CAM_Y;            /* altura real para que algo a profundidad z se vea a la altura Y de la referencia */
const P=REF.prof, PN=P.length;
/* Oscurecimiento medido en la referencia (sombra bajo la barbilla y en la base de la barriga): desde la fila 120, cada 5 filas */
const AO=[1.027, 1.006, 0.981, 0.959, 0.945, 0.939, 0.935, 0.932, 0.927, 0.921, 0.912, 0.902, 0.891, 0.882, 0.876, 0.879, 0.891, 0.913, 0.941, 0.97, 0.993, 1.005, 1.007, 1.001, 0.986, 0.963, 0.931, 0.89, 0.843, 0.796, 0.752, 0.715, 0.688, 0.673, 0.673, 0.687, 0.716, 0.756, 0.799, 0.838, 0.868, 0.888, 0.901, 0.907, 0.91, 0.91, 0.909, 0.906, 0.903, 0.899, 0.894, 0.888, 0.882, 0.874, 0.866, 0.856, 0.845, 0.834, 0.824, 0.815, 0.807, 0.801, 0.797, 0.794, 0.791, 0.789, 0.786, 0.782, 0.779, 0.776, 0.773, 0.771, 0.769, 0.767, 0.764, 0.762, 0.761, 0.761, 0.765, 0.772, 0.781, 0.791];
function aoAt(py){
  const f=(py-120)/5;
  if(f<=0) return AO[0];
  if(f>=AO.length-1) return AO[AO.length-1];
  const i=Math.floor(f), t=f-i;
  return AO[i]*(1-t)+AO[i+1]*t;
}
const WHITE_LIN=Math.pow(250/255,2.2);
const GROUND=lift(-1.678,0.7);                       /* base de las patas */

function radiusAt(y){
  for(let i=0;i<PN-1;i++){
    const a=P[i], b=P[i+1];
    if(a[1]<=y&&b[1]>=y){ const t=(y-a[1])/((b[1]-a[1])||1); return a[0]+(b[0]-a[0])*t; }
  }
  return 0.7;
}
const surfaceZ=y=>radiusAt(y)*BODY_Z;

/* Mancha blanca (cara y barriga): distancia con signo medida sobre la referencia */
const SDF=(function(){
  const s=REF.sdf, bin=atob(s.b64), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return {a:a,x0:s.x0,y0:s.y0,st:s.stride,w:s.w,h:s.h,k:s.k};
})();
function sdfAt(px,py){
  const gx=(px-SDF.x0)/SDF.st, gy=(py-SDF.y0)/SDF.st;
  if(gx<0||gy<0||gx>SDF.w-1||gy>SDF.h-1) return 99;
  const x0=Math.floor(gx), y0=Math.floor(gy), fx=gx-x0, fy=gy-y0;
  const x1=Math.min(x0+1,SDF.w-1), y1=Math.min(y0+1,SDF.h-1), A=SDF.a, w=SDF.w;
  const top=A[y0*w+x0]*(1-fx)+A[y0*w+x1]*fx, bot=A[y1*w+x0]*(1-fx)+A[y1*w+x1]*fx;

/* Ojos felices: trazo medido columna por columna */
function eyeCov(px,py){
  let best=0;
  for(let q=0;q<REF.eyes.length;q++){
    const e=REF.eyes[q], n=e.yc.length, cf=px-e.x0;
    if(cf<-3||cf>n+2) continue;
    const c=clamp(cf,0,n-1), i0=Math.floor(c), i1=Math.min(i0+1,n-1), f=c-i0;
    const yc=e.yc[i0]*(1-f)+e.yc[i1]*f-0.5, th=e.t[i0]*(1-f)+e.t[i1]*f+1.0;
    const dy=Math.abs(py-yc)-th/2, dx=cf<0?-cf:(cf>n-1?cf-(n-1):0);
    const d=Math.hypot(Math.max(dy,0),dx)+Math.min(dy,0);
    best=Math.max(best,clamp(0.5-d/1.3,0,1));
  }
  return best;
}

function makeBodyTexture(){
  const W=2048,H=1024;

  const ctx=cv.getContext('2d'), img=ctx.createImageData(W,H), d=img.data;
  const K=[13,15,19], Wt=[250,251,253], E=[14,15,20];
  const sn=new Float32Array(W), cs=new Float32Array(W);
  for(let i=0;i<W;i++){ const a=((i+0.5)/W-0.5)*2*Math.PI; sn[i]=Math.sin(a); cs[i]=Math.cos(a); }
  for(let j=0;j<H;j++){
    const f=(1-(j+0.5)/H)*(PN-1), i0=Math.min(PN-2,Math.floor(f)), t=f-i0;
    const r=P[i0][0]+(P[i0+1][0]-P[i0][0])*t, y=P[i0][1]+(P[i0+1][1]-P[i0][1])*t;
    for(let i=0;i<W;i++){
      const o=(j*W+i)*4;

      rch=rch*(1-em)+E[0]*em; gch=gch*(1-em)+E[1]*em; bch=bch*(1-em)+E[2]*em;

/* Formas suaves cerradas (esfera deformada con vértices compartidos), con color por vértice */
function makeBlob(nu,nv,deform,colorFn){
  const pos=[], col=[], idx=[];
  const add=(x,y,z)=>{ const d=deform(x,y,z), c=colorFn(x,y,z); pos.push(d[0],d[1],d[2]); col.push(c[0],c[1],c[2]); return pos.length/3-1; };
  const top=add(0,1,0), rings=[];
  for(let j=1;j<nv;j++){
    const th=Math.PI*j/nv, y=Math.cos(th), r=Math.sin(th);
    rings.push(pos.length/3);
    for(let i=0;i<nu;i++){ const ph=2*Math.PI*i/nu; add(r*Math.sin(ph),y,r*Math.cos(ph)); }
  }
  const bot=add(0,-1,0);
  for(let i=0;i<nu;i++){ const n=(i+1)%nu; idx.push(top,rings[0]+i,rings[0]+n); }
  for(let j=0;j<rings.length-1;j++) for(let i=0;i<nu;i++){
    const n=(i+1)%nu, a=rings[j]+i, b=rings[j]+n, c=rings[j+1]+i, d=rings[j+1]+n;
    idx.push(a,c,b, b,c,d);
  }
  const L=rings[rings.length-1];
  for(let i=0;i<nu;i++){ const n=(i+1)%nu; idx.push(bot,L+n,L+i); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

      if (tour.f >= 1) {
        tour.seg++; tour.f = 0; root.position.copy(tour.pts[tour.seg]);
        if (tour.stopAt[tour.seg] !== undefined) beginDwell(tour.stopAt[tour.seg]);
        else if (tour.seg >= tour.n - 1) finishTour();
      } else posAt(tour.seg, easeSeg(tour.f, s, e), root.position);
    } else {
      root.position.copy(tour.pts[tour.seg]);
    }
    if (tour) tour.w = lerp(tour.w, tour.state === 'dwell' ? 1 : 0, damp(2.2, dt));
  }
  if (singing && songAnalyser && songBuf) {
    /* el pico sigue la banda de la voz, no los graves de la música */
    songAnalyser.getByteFrequencyData(songBuf);
    const binHz = (ac ? ac.sampleRate : 48000) / songAnalyser.fftSize;
    const lo = Math.max(1, Math.floor(220 / binHz)), hi = Math.min(songBuf.length - 1, Math.ceil(4200 / binHz));
    let sum = 0;
    for (let i = lo; i <= hi; i++) sum += songBuf[i];
    const avg = sum / Math.max(1, hi - lo + 1) / 255;
    songLevel = clamp((avg - 0.1) * 1.55, 0, 0.9);
  }
  if (tour && tour.singing) updateSongLyric();
  const showOtter = S.otterVis > 0.005;
  root.visible = showOtter;
  if (showOtter) {
    const ov = S.otterVis, back = 1 + 1.4 * Math.pow(ov - 1, 3) + 0.4 * Math.pow(ov - 1, 2);
    root.scale.setScalar(Math.max(0.001, ov < 1 ? back * ov : 1));
    const vel = V.c.copy(root.position).sub(prevPos).divideScalar(Math.max(dt, 1e-4));
    speedNow = lerp(speedNow, vel.length(), damp(6, dt));
    const introOn = S.phase === 'intro';
    const dwell = introOn || (!!tour && tour.state === 'dwell');
    if (dwell) { V.a.copy(camera.position).sub(root.position).setY(0); if (V.a.lengthSq() < 1e-4) V.a.set(0, 0, 1); quatLook(V.a.normalize(), qb); }
    else if (speedNow > 1.2) quatLook(V.a.copy(vel).normalize(), qb);
    else qb.copy(root.quaternion);
    root.quaternion.slerp(qb, damp(dwell ? 3.5 : 5, dt));
    guideDir.set(0, 0, 1).applyQuaternion(root.quaternion);
    guideKey.position.copy(root.position).addScaledVector(guideDir, 2.4); guideKey.position.y += 3.2;
    guideRim.position.copy(root.position).addScaledVector(guideDir, -2.0); guideRim.position.y += 2.2;
    guideKey.intensity = 0.62 * ov; guideRim.intensity = 0.55 * ov;
    V.a.set(0, 0, 1).applyQuaternion(root.quaternion);
    const hd = Math.atan2(V.a.x, V.a.z); let dh = hd - heading; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); heading = hd;
    yawRate = lerp(yawRate, clamp(dh / Math.max(dt, 1e-4), -3, 3), damp(5, dt));
    const wUp = dwell ? 1 : (tour ? tour.w : 0);
    otter.rig.rotation.x = otter.pitch(wUp);
    otter.rig.rotation.z = lerp(otter.rig.rotation.z, clamp(-yawRate * 0.22, -0.5, 0.5) * (1 - wUp), damp(5, dt));
    otter.rig.rotation.y = lerp(otter.rig.rotation.y, 0.08 * wUp, damp(3, dt));
    otter.update(dt, T, clamp(speedNow / 18, 0, 1), wUp, pose, envOn, singing, songLevel);
    trail.update(dt, V.c.set(0, 0, -1.25).applyQuaternion(root.quaternion).add(root.position), speedNow > 2 ? speedNow * 0.9 : 0);
  } else {
    trail.update(dt, root.position, 0);
    guideKey.intensity = guideRim.intensity = 0;
  }
  updateNotes(T, !!(tour && tour.singing));

  /* --- cámara --- */
  let desPos = V.c, desLook = V.b.set(0, 0, 0), camRate = 2.4;
  if (tour) {
    V.a.set(0, 0, 1).applyQuaternion(root.quaternion).setY(0).normalize();
    desPos = V.c.copy(root.position).addScaledVector(V.a, -8).add(V.up.clone().multiplyScalar(3.2));
    desPos.lerp(tour.stopCam, tour.w);
    desLook = V.b.copy(root.position).add(V.up.clone().multiplyScalar(0.4 + 1.6 * tour.w));
    camRate = tour.state === 'dwell' ? 2.2 : 3.2;
  } else if (S.phase === 'scan') {
    desPos.set(Math.sin(T * 0.4) * 0.8, Math.cos(T * 0.3) * 0.5, SCAN_Z); camRate = 4;
  } else if (S.phase === 'form') {
    const f = smooth(0, 0.62, S.form);
    desPos.set(0, 0, SCAN_Z).lerp(INTRO_CAM, f);
    desLook.set(0, 0, 0).lerp(INTRO_LOOK, f);
    camRate = 4.2;
  } else if (S.phase === 'intro') {
    desPos.copy(INTRO_CAM); desLook.copy(INTRO_LOOK); camRate = 2.4;
  } else if (S.phase === 'boom' || S.phase === 'final') {
    desPos.copy(OVERVIEW);
    camRate = S.phase === 'boom' ? 1.8 : 0.9;
  }
  if (S.phase !== 'scan') {
    const amp = S.phase === 'tour' ? 0.75 : 1;
    desPos.x += (Math.sin(T * 0.23) * 0.45 + pointer.x * 0.65) * amp;
    desPos.y += (Math.sin(T * 0.31 + 1.4) * 0.25 - pointer.y * 0.4) * amp;
    desLook.x += (Math.sin(T * 0.17 + 0.6) * 0.25 + pointer.x * 0.4) * amp;
    desLook.y += (Math.sin(T * 0.21 + 2.1) * 0.12 - pointer.y * 0.25) * amp;
  }
  if (S.phase === 'boom') {
    const sh = S.boom * (1 - S.boom * 0.4);
    desPos.x += Math.sin(T * 41) * 1.1 * sh;
    desPos.y += Math.cos(T * 37) * 0.8 * sh;
  }
  cam.pos.lerp(desPos, damp(camRate, dt)); cam.look.lerp(desLook, damp(camRate + 0.6, dt));
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  updateGalaxyFX(dt, T, galVis);
  guideFill.position.copy(camera.position); guideFill.position.y += 1.4;
  guideFill.intensity = 0.28 * S.otterVis;

  /* --- tono de escaneo --- */
  if (scanGain && ac) {
    scanGain.gain.setTargetAtTime(S.phase === 'scan' && !muted ? S.prog * 0.3 : 0, ac.currentTime, 0.08);
    scanOsc.frequency.setTargetAtTime(170 + S.prog * 480, ac.currentTime, 0.1);
  }

  /* --- globo sobre la cabeza --- */
  if (bub.show) {
    otter.head.getWorldPosition(headW); headW.y += 1.15; headW.project(camera);
    const W = innerWidth, H = innerHeight, bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let x = (headW.x * 0.5 + 0.5) * W, y = (-headW.y * 0.5 + 0.5) * H;
    if (headW.z > 1) { x = W / 2; y = H - 90; }
    const gut = 16 + bw / 2, lx = clamp(x, gut, W - gut), top = clamp(y, bh + 74, H - 18);
    bubble.style.transform = `translate(${lx - bw / 2}px, ${top - bh - 12}px)`;
    bubble.style.setProperty('--tx', clamp(x - (lx - bw / 2), 24, bw - 24) + 'px');
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* arranque */
resize(); addEventListener('resize', resize);
camera.position.copy(cam.pos); camera.lookAt(0, 0, 0);
setUI();
requestAnimationFrame(frame);

/* ayuda para pruebas */
window.__pinguino = {
  patch(o) { Object.assign(S, o); },
  begin() { if (S.phase === 'scan') { S.prog = 1; } },
  skipTo(k) {
    stopSong(false); closeLetter(true); hideBubble(); tour = null; intro = null;
    S.phase = k === 0 ? 'intro' : 'tour'; S.formT = FORM_T; S.form = 1; S.otterOn = true; S.otterVis = 1; S.galT = 1;
    $('#scan').classList.add('gone');
    otter.root.position.copy(INTRO_POS); otter.root.quaternion.identity();
    if (otter.reset) otter.reset();
    if (k === 0) {
      intro = { t: 1, msg: 0, started: true }; startIntro();
    } else {
      startTour();
      const idx = Object.keys(tour.stopAt).find(i => tour.stopAt[i] === k);
      if (idx === undefined) return;
      tour.seg = +idx; tour.f = 0; tour.state = 'fly'; tour.w = 0;
      otter.root.position.copy(tour.pts[tour.seg]); beginDwell(k);
    }
    uiKey = ''; setUI();
  },
  song() { startSong(); },
  endSong() { stopSong(true); },
  boom() { stopSong(false); closeLetter(true); finishTour(); },
  fx() { return { comets: comets.map(c => ({ active: c.active, wait: +c.wait.toFixed(2), t: +c.t.toFixed(2) })), notes: noteSprites.map(s => +s.material.opacity.toFixed(2)), dust: +dustMat.uniforms.uFx.value.toFixed(2), nebulas: nebulas.length, fireflies: fireflies.length, halo: +coreHalo.material.opacity.toFixed(3) }; },
  info() { return { phase: S.phase, form: +S.form.toFixed(2), boom: +S.boom.toFixed(2), final: +S.finalT.toFixed(2), prog: +S.prog.toFixed(2), mouth: +(otter.state.mouth || 0).toFixed(2), analyser: !!songAnalyser, pos: otter.root.position.toArray().map(v => +v.toFixed(1)), intro: intro && { msg: intro.msg, started: intro.started }, tour: tour && { seg: tour.seg, state: tour.state, stop: tour.stop, singing: tour.singing, songDone: tour.songDone } }; }
};
})();
</script>
