<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pingüino Galáctico</title>
<meta name="description" content="Una huella que se escanea con el dedo, una galaxia que nace de ella, un pingüino guía y un final con explosión de partículas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: un solo escenario WebGL a pantalla completa. Todas las partículas nacen de una huella, forman la galaxia, y al final estallan para formar un corazón. La interfaz es mínima y flota encima. */
@font-face{font-family:'Great Vibes';src:url('fonts/great-vibes.woff2') format('woff2');font-weight:400;font-display:swap}
:root{
  --space-0:#05010b;
  --space-1:#14061f;
  --ink:#fff4f8;
  --ink-dim:#d9c3e6;
  --rose:#ff4d8d;
  --violet:#9b6bff;
  --paper:#fff4fa;
  --paper-ink:#3b1530;
  --glass:rgba(255,255,255,.09);
  --glass-line:rgba(255,255,255,.22);
  --font-ui:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --font-script:'Dancing Script','Great Vibes','Brush Script MT','Segoe Script',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--space-0);color:var(--ink);font-family:var(--font-ui);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 45%,#2a0f4d 0%,var(--space-1) 55%,var(--space-0) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* título final */
#brand{
  position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;z-index:5;pointer-events:none;
  font-family:var(--font-script);font-weight:700;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.1;letter-spacing:.01em;
  text-shadow:0 0 18px rgba(255,77,141,.9),0 0 44px rgba(255,77,141,.5);
  opacity:0;transform:translateY(-14px);transition:opacity 1.4s,transform 1.4s;
}
body.show-brand #brand{opacity:1;transform:none}

/* botones */
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:15px;font-weight:500;transition:transform .15s,background .2s,opacity .3s;
}
.chip:hover{background:rgba(255,255,255,.16)}
.chip:active{transform:scale(.95)}
#mute{position:fixed;z-index:35;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:44px;padding:0;justify-content:center;font-size:18px}
#bar{
  position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
#bar [hidden]{display:none}

/* globo del pingüino */
#bubble{
  position:fixed;left:0;top:0;z-index:15;width:min(344px,calc(100vw - 32px));padding:14px 18px 14px;border-radius:22px;
  background:var(--paper);color:var(--paper-ink);box-shadow:0 10px 44px rgba(255,77,141,.4);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s;will-change:transform;
}
#bubble.show{opacity:1;visibility:visible;pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#bubble::after{
  content:"";position:absolute;left:var(--tx,50%);bottom:-8px;width:18px;height:18px;background:var(--paper);
  transform:translateX(-50%) rotate(45deg);border-radius:3px;
}
#bubble .who{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#c2306b;margin-bottom:5px}
#bubble p{font-size:18px;line-height:1.42;min-height:2.84em;user-select:text;-webkit-user-select:text}
#bubble .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;min-height:38px}
.pill{
  min-height:38px;padding:0 16px;border-radius:999px;border:0;font-weight:600;font-size:15px;
  background:linear-gradient(135deg,#ff4d8d,#c2306b);color:#fff;box-shadow:0 4px 14px rgba(194,48,107,.45);
}
.pill.ghost{background:transparent;color:#8a4a6c;box-shadow:none}

/* escáner de huella */
#scan{position:fixed;inset:0;z-index:30;pointer-events:none;transition:opacity 1.2s,visibility 1.2s}
#scan.gone{opacity:0;visibility:hidden}
#scanTitle{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 26px);text-align:center;padding-inline:24px;
  font-family:var(--font-script);font-weight:700;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.1;text-wrap:balance;
  text-shadow:0 0 20px rgba(255,77,141,.9),0 0 48px rgba(255,77,141,.5);
}
#scanner{
  position:absolute;left:50%;top:50%;width:calc(var(--sw,300) * 1px);height:calc(var(--sh,400) * 1px);transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:auto;cursor:pointer;touch-action:none;border:1px dashed rgba(255,255,255,.28);
  transition:box-shadow .3s,border-color .3s;
}
#scanner.holding{border-color:rgba(255,120,170,.85);box-shadow:0 0 56px rgba(255,77,141,.5),inset 0 0 44px rgba(255,77,141,.2)}
#ringProg{
  position:absolute;inset:-7px;border-radius:50%;--p:0;pointer-events:none;
  background:conic-gradient(#ff6aa3 calc(var(--p) * 1%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  filter:drop-shadow(0 0 6px #ff4d8d);
}
#scanHint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center;padding-inline:24px;
  font-size:19px;line-height:1.4;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.7);
}
#scanHint small{display:block;font-size:14px;color:var(--ink-dim);margin-top:4px}
#scanFail{position:absolute;left:0;right:0;top:50%;text-align:center;padding-inline:24px;font-size:17px;color:var(--ink-dim)}

#flash{
  position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#fff 0%,rgba(255,170,210,.9) 32%,rgba(255,77,141,0) 75%);
}
#caption{
  position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);text-align:center;z-index:12;pointer-events:none;
  padding-inline:max(22px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-right,0px));
  font-family:var(--font-script);font-weight:700;font-size:clamp(1.6rem,5.2vw,2.5rem);line-height:1.2;text-wrap:balance;
  text-shadow:0 0 18px rgba(255,77,141,.95),0 0 40px rgba(255,77,141,.5);opacity:0;transition:opacity 1.8s;
}
#caption.show{opacity:1}

/* serenata */
#serenade{
  position:fixed;z-index:18;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);width:min(460px,calc(100vw - 38px));
  padding:14px 18px 12px;border-radius:22px;background:linear-gradient(160deg,rgba(32,9,48,.9),rgba(18,5,30,.74));
  border:1px solid var(--glass-line);box-shadow:0 14px 46px rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transform:translate(-50%,12px) scale(.97);text-align:center;opacity:0;visibility:hidden;transition:opacity .4s,transform .4s,visibility .4s;pointer-events:none;
}
#serenade.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
#serenade .songWho{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffc2dd;text-shadow:0 1px 10px rgba(0,0,0,.6)}
#lyricLine{
  font-family:var(--font-script);font-weight:700;font-size:clamp(1.7rem,6.2vw,2.6rem);line-height:1.25;min-height:2.5em;margin:6px 0 12px;
  color:#fff;text-shadow:0 0 18px rgba(255,77,141,.95),0 0 44px rgba(255,77,141,.55);transition:opacity .3s;
}
#songBars{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:22px;margin-bottom:10px}
#songBars i{display:block;width:4px;border-radius:3px;background:linear-gradient(#ff8ab8,#9b6bff);animation:bars .9s ease-in-out infinite;opacity:.85}
#songBars i:nth-child(2n){animation-delay:.15s}
#songBars i:nth-child(3n){animation-delay:.32s}
#songBars i:nth-child(4n){animation-delay:.46s}
#songStop{pointer-events:auto;background:rgba(255,255,255,.12);border:1px solid var(--glass-line);color:#fff;box-shadow:none}
@keyframes bars{0%,100%{height:5px}50%{height:22px}}

/* carta final */
#modal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,77,141,.2),rgba(5,1,11,.66) 68%);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:.4s;
}
#modal.open{opacity:1;visibility:visible}
.letter{
  position:relative;max-width:480px;width:100%;max-height:calc(100dvh - 36px);overflow:auto;padding:62px 30px 26px;border-radius:20px;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.85),transparent 46%),
    repeating-linear-gradient(0deg,rgba(180,110,140,.055) 0 1px,transparent 1px 28px),
    linear-gradient(160deg,#fffaf5,#ffeef6 55%,#ffe2ee);
  color:var(--paper-ink);border:1px solid rgba(224,36,94,.35);
  box-shadow:0 30px 90px rgba(0,0,0,.58),0 0 0 6px rgba(255,255,255,.05);
  transform:translateY(30px) scale(.94) rotateX(6deg);transform-origin:50% 100%;
  transition:transform .6s cubic-bezier(.2,.9,.25,1.15),opacity .5s;opacity:0;
}
#modal.open .letter{transform:none;opacity:1}
.letter::before{content:"";position:absolute;inset:10px;border:1px solid rgba(224,36,94,.16);border-radius:14px;pointer-events:none}
.letter .seal{
  position:absolute;top:14px;left:50%;transform:translateX(-50%) rotate(-6deg);width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff6a9f,#c21e56 60%,#8e123a);display:grid;place-items:center;
  color:#ffd9e7;font-size:19px;box-shadow:0 6px 18px rgba(142,18,58,.45),inset 0 0 0 2px rgba(255,255,255,.18);
}
.letterKicker{text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#b4547c;margin-bottom:4px}
.letter h2{font-family:var(--font-script);font-weight:700;font-size:2.75rem;text-align:center;margin-bottom:12px;color:#8e1f4b;text-shadow:0 1px 0 rgba(255,255,255,.8)}
#lText{white-space:pre-line;line-height:1.75;font-size:17px;text-align:center;min-height:7em;padding:0 6px;color:#4a1b36;outline:none;user-select:text;-webkit-user-select:text}
.sign{margin-top:18px;text-align:right;font-family:var(--font-script);font-size:1.9rem;line-height:1.05;color:#8e1f4b}
.sign span{display:block;font-size:2.3rem}
.letterActions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.letterActions .pill{font-size:14px;min-height:42px}
.letter small{display:block;margin-top:14px;text-align:center;color:#a26884;opacity:.8;font-size:12px}
#close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(142,31,75,.1);color:#8e1f4b;font-size:16px}
#close:hover{background:rgba(142,31,75,.18)}
@media (max-width:520px){
  #brand{font-size:clamp(1.7rem,7vw,2.6rem);padding-inline:54px;line-height:1.08}
  .letter{padding:58px 23px 22px;border-radius:18px}
  .letter .seal{top:10px;width:40px;height:40px;font-size:17px}
  .letter h2{font-size:2.35rem;margin-bottom:8px}
  #lText{font-size:16px;line-height:1.65;min-height:5em}
  .sign{font-size:1.7rem;margin-top:14px}
  .sign span{font-size:2rem}
  .letterActions{margin-top:14px}
  .letter small{margin-top:10px}
}
</style>

<canvas id="gl" aria-label="Galaxia 3D que nace de una huella"></canvas>

<h2 id="brand"></h2>
<button class="chip" id="mute" aria-label="Silenciar sonido">🔊</button>

<div id="scan">
  <h1 id="scanTitle"></h1>
  <div id="scanner" role="button" tabindex="0" aria-label="Mantén presionado para escanear la huella">
    <div id="ringProg"></div>
  </div>
  <p id="scanHint"></p>
  <p id="scanFail" hidden></p>
</div>

<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<div id="bubble">
  <div class="who" id="who"></div>
  <p id="say"></p>
  <div class="row">
    <button class="pill ghost" id="skipMsg" type="button">Siguiente ›</button>
    <button class="pill" id="singBtn" type="button" hidden>🎵 Escúchame cantar</button>
    <button class="pill" id="openLetter" type="button" hidden>💌 Abrir mi carta</button>
  </div>
</div>

<p id="caption"></p>
<div id="flash"></div>

<div id="serenade" aria-live="polite">
  <p class="songWho">Pingu te canta</p>
  <p id="lyricLine"></p>
  <div id="songBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button class="pill" id="songStop" type="button">Saltar canción ›</button>
</div>

<div id="bar">
  <button class="chip" id="skip" type="button" hidden>Saltar recorrido</button>
  <button class="chip" id="again" type="button" hidden>↻ Volver a empezar</button>
  <button class="chip" id="mail" type="button" hidden>💌 Carta</button>
  <label class="chip" id="photoBtn" for="file" hidden>📷 Fotos de la galaxia</label>

</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="lTitle">
  <div class="letter">
    <button id="close" type="button" aria-label="Cerrar carta">✕</button>
    <div class="seal" aria-hidden="true">♥</div>

    <p id="lText" contenteditable="true" spellcheck="false"></p>
    <p class="sign">Con todo mi amor,<span>Camilo</span></p>
    <div class="letterActions">
      <button class="pill ghost" id="againLetter" type="button">↻ Desde el inicio</button>
      <button class="pill" id="closeLetter" type="button">Cerrar y ver la galaxia</button>
    </div>
    <small>Toca el texto para escribir tu propio mensaje</small>
  </div>
</div>

<audio id="song" preload="none"></audio>

<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';

/* ================= CONFIGURACIÓN: cambia aquí tus textos ================= */
const CONFIG = {
  guide: 'Pingu',
  title: 'Feliz Cumpleaños, Karen 💗',
  scanTitle: 'Pon tu dedo para entrar',
  caption: 'Mi Mamacita Hermosa, esto es todo para ti. 💗',
  phrases: [
    'Eres mi universo', 'Te amo hasta las estrellas', 'Contigo todo brilla', 'Mi corazón es tuyo',
    'Eres mi lugar favorito', 'Nuestro amor es infinito', 'Te elegiría en todas las galaxias',
    'Gracias por existir', 'Eres mi razón de sonreír', 'Siempre tú', 'Mi estrella favorita', 'Amarte es fácil'
  ],
  stops: [
    { say: ['¡Hola, mi Mamacita Hermosa! 🐧', 'Soy Pingu. Nací de tu huella, así que esta galaxia es toda tuya.', 'Cuando quieras, te llevo a pasear por ella. ✨'], pose: 'wave' },
    { say: ['Estas estrellas giran despacio, brazo por brazo.', 'Cada una es un momento tuyo que guardo conmigo.'] },
    { say: ['Mira cómo flotan las frases a nuestro alrededor.', 'Son todos los “te amo” que no caben en una sola vez.'] },
    { say: ['Y aquí giran los recuerdos, como pequeñas lunas.', 'Cada recuerdo es una estrella más en este cielo.'] },

    {

      postSong: 'Y ahora sí… mi carta es toda tuya. Ábrela. 💌'
    }
  ],
  letterTitle: 'Para Karen',
  letter: 'Mi Mamacita Hermosa:\n\nSi pudiera elegir un lugar en todo el universo, elegiría el que ocupas en mi vida. Gracias por cada mensaje, cada risa y cada momento que guardamos, incluso a la distancia.\n\nHoy celebro que existes, que iluminas todo a tu paso y que haces que hasta las galaxias se vean pequeñas. Te amo hoy, mañana y en todas las vidas que nos queden por vivir. 💗',
  /* Para usar la canción elegida, coloca el archivo en public/cancion.mp3.
     Si no existe, Pingu canta sobre la cajita de música romántica. */
  song: {
    title: 'Para ti, mi Mamacita Hermosa',
    lyrics: [
      'Si la noche se hace larga,',
      'yo te canto desde aquí…',
      'cada estrella es un “te quiero”',
      'que guardé para ti. 💗',
      'Duerme tranquila, mi amor,',
      'que mañana te escribo otra vez. ✨'
    ]
  }
};

/* Ruta del pingüino. Cada punto es [x, y, z]; "stop" enlaza con CONFIG.stops. */
const WAY = [
  { p: [30, 9, 44], stop: 1 },
  { p: [52, 6, 18] },
  { p: [50, 3, -18] },
  { p: [30, 4, -44], stop: 2 },
  { p: [-8, 9, -48] },
  { p: [-38, 5, -26] },
  { p: [-34, 4, 3], stop: 3 },
  { p: [-26, 9, 28] },
  { p: [-4, 6, 34] },
  { p: [12, 2, 21], stop: 4 },
  { p: [5, 5, 15] },
  { p: [-3, 1.5, 15], stop: 5 }
];

/* Tiempos de cada fase, en segundos */
const SCAN_HOLD = 3.2, FORM_T = 8.5, BOOM_T = 1.5, FINAL_READY = 3.2;
/* ========================================================================= */

const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
const EDIT = location.hash === '#editar';
const INTRO_POS = new THREE.Vector3(0, 2.0, 4.5);
const INTRO_CAM = new THREE.Vector3(4.2, 3.35, 10.2);
const INTRO_LOOK = new THREE.Vector3(0, 2.35, 4.2);

$('#brand').textContent = CONFIG.title;
$('#scanTitle').textContent = CONFIG.scanTitle;
$('#who').textContent = CONFIG.guide;
$('#lTitle').textContent = CONFIG.letterTitle;
$('#lText').textContent = CONFIG.letter;
$('#caption').textContent = CONFIG.caption;

function failScreen(msg) { const f = $('#scanFail'); f.hidden = false; f.textContent = msg; $('#scanner').style.display = 'none'; $('#scanHint').textContent = ''; }
if (typeof THREE === 'undefined') { failScreen('No se pudo cargar. Revisa tu conexión y vuelve a abrir la página.'); return; }

/* ---------------- renderer, escena, cámara ---------------- */
const canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (err) { failScreen('Tu navegador no admite 3D. Prueba con otro o activa la aceleración por hardware.'); return; }
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 900);
const SCAN_Z = 60;

/* uniformes compartidos por todos los sistemas de partículas */
const U = {
  uTime: { value: 0 }, uGalTime: { value: 0 }, uScale: { value: 600 },
  uForm: { value: 0 }, uBoom: { value: 0 }, uProg: { value: 0 }, uScanY: { value: 0 }
};

function resize() {
  const w = innerWidth, h = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 55 + (1 - w / h) * 34 : 55;

/* ---------------- shader común: huella → galaxia → explosión → renacer ---------------- */
const COMMON = `
  uniform float uTime, uGalTime, uScale, uForm, uBoom, uProg, uScanY;
  attribute vec3 aMisc;   // x: tamaño, y: semilla, z: retraso de formación
  attribute vec3 aColor, aStart;
  varying vec3 vColor; varying float vAlpha;
  float ease(float t){ return t * t * (3.0 - 2.0 * t); }
  float h11(float n){ return fract(sin(n * 91.345) * 47453.5453); }
  vec3 run(vec3 fin, out float sz){
    float seed = aMisc.y, delay = aMisc.z;
    float t = clamp((uForm - delay * 0.5) / 0.5, 0.0, 1.0), e = ease(t);
    vec3 d = fin - aStart;
    vec3 side = normalize(cross(d, vec3(0.0, 1.0, 0.0)) + vec3(0.0001));
    vec3 p = mix(aStart, fin, e) + side * sin(e * 3.14159) * (seed - 0.5) * 14.0;
    float b = 1.0 - pow(1.0 - uBoom, 3.0);
    vec3 dir = normalize(vec3(h11(seed * 13.1) - 0.5, h11(seed * 29.7) - 0.5, h11(seed * 57.3) - 0.5) + vec3(0.0001));
    vec3 radial = normalize(p + vec3(0.001));
    p += (radial * 0.6 + dir * 0.4) * b * (25.0 + 85.0 * h11(seed * 7.7));
    vec3 col = mix(vec3(1.0, 0.72, 0.88), aColor, e);
    float sc = (1.0 - smoothstep(0.0, 2.2, abs(aStart.y - uScanY))) * uProg * (1.0 - uForm);
    col += vec3(0.7, 0.45, 0.6) * sc;
    vColor = col;
    float a0 = (mix(0.13, 0.46, uProg) + sc * 0.5) * (0.82 + 0.18 * sin(uTime * 2.0 + seed * 6.28));
    vAlpha = mix(a0, 0.95, e);
    sz = mix(0.17, aMisc.x, e);
    return p;
  }`;
const POINT_FRAG = `
  varying vec3 vColor; varying float vAlpha;
  void main(){
    float d = length(gl_PointCoord - 0.5);
    float a = smoothstep(0.5, 0.0, d);
    gl_FragColor = vec4(vColor, a * a * vAlpha);
  }`;
function pointsMat(vertexBody, extraUniforms, extraDecl) {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({}, U, extraUniforms || {}),
    vertexShader: COMMON + (extraDecl || '') + `void main(){ float sz; ${vertexBody}
      vec4 mv = modelViewMatrix * vec4(p, 1.0);

    }`,
    fragmentShader: POINT_FRAG, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending

}

/* ---------------- el pingüino ---------------- */
function buildPenguin() {
  const root = new THREE.Group(), rig = new THREE.Group(), squash = new THREE.Group(), model = new THREE.Group();
  root.add(rig); rig.add(squash); squash.add(model);
  rig.scale.setScalar(0.82);

  /* medidas del cuerpo: las mismas del estudio que aprobaste */
  const BODY_A = 0.92, BODY_H = 1.5, BODY_N = 2.45, BODY_Z = 0.88, GROUND = -1.585;
  squash.position.y = GROUND; model.position.y = -GROUND;

  const C = hex => new THREE.Color(hex).convertSRGBToLinear();
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  /* Superelipse: costados casi rectos, base un poco más ancha que la cabeza. */
  function profileAt(th) {
    const c = Math.cos(th), s = Math.sin(th), e = 2 / BODY_N;
    const taper = 1 - 0.07 * s;
    return [BODY_A * taper * Math.pow(Math.abs(c), e), BODY_H * (s < 0 ? -1 : 1) * Math.pow(Math.abs(s), e)];
  }
  function surfaceZ(y) {
    let prev = null;
    for (let j = 0; j <= 400; j++) {
      const p = profileAt(j / 400 * Math.PI / 2);
      if (prev && prev[1] <= y && p[1] >= y) {
        const t = (y - prev[1]) / (p[1] - prev[1]);
        return (prev[0] + (p[0] - prev[0]) * t) * BODY_Z;
      }
      prev = p;
    }
    return 0.7;
  }

  /* textura: negro, barriga y cara blancas, ojos felices cerrados */
  const SHAPES = [
    [0, -0.62, 0.80, 0.76],
    [-0.37, 0.70, 0.38, 0.52],
    [0.37, 0.70, 0.38, 0.52],
    [0, 0.36, 0.64, 0.30]
  ];
  function sdE(x, y, cx, cy, a, b) {
    const nx = (x - cx) / a, ny = (y - cy) / b, k = Math.sqrt(nx * nx + ny * ny);
    const h = Math.sqrt((nx / a) * (nx / a) + (ny / b) * (ny / b));
    return h < 1e-9 ? -Math.min(a, b) : (k - 1) * k / h;
  }
  const cov = (d, aa) => d >= aa / 2 ? 0 : (d <= -aa / 2 ? 1 : 0.5 - d / aa);
  function whiteCoverage(x, y) {
    let d = 1e9;
    for (let k = 0; k < 4; k++) { const s = SHAPES[k], v = sdE(x, y, s[0], s[1], s[2], s[3]); if (v < d) d = v; }
    return cov(d, 0.012);
  }
  function eyeCoverage(x, y) {
    const cx = x < 0 ? -0.39 : 0.39, cy = 0.565, R = 0.13, lo = 0.436, hi = Math.PI - 0.436;
    const a = Math.atan2(y - cy, x - cx);
    const ca = a < lo ? lo : (a > hi ? hi : a);
    const w = 0.013 + 0.012 * Math.sin((ca - lo) / (hi - lo) * Math.PI);
    const dx = x - (cx + R * Math.cos(ca)), dy = y - (cy + R * Math.sin(ca));
    return cov(Math.sqrt(dx * dx + dy * dy) - w, 0.008);
  }
  function makeBodyTexture() {
    const W = 2048, H = 1024;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
    const K = [21, 23, 29], Wt = [252, 249, 250], E = [17, 18, 24];
    const rr = new Float32Array(H), yy = new Float32Array(H);
    for (let j = 0; j < H; j++) { const v = 1 - (j + 0.5) / H, p = profileAt(-Math.PI / 2 + Math.PI * v); rr[j] = p[0]; yy[j] = p[1]; }
    const sn = new Float32Array(W), fr = new Uint8Array(W);
    for (let i = 0; i < W; i++) { const a = ((i + 0.5) / W - 0.5) * 2 * Math.PI; sn[i] = Math.sin(a); fr[i] = Math.cos(a) > 0 ? 1 : 0; }
    for (let j = 0; j < H; j++) {
      const y = yy[j], r = rr[j];
      for (let i = 0; i < W; i++) {
        const o = (j * W + i) * 4;
        let wm = 0, em = 0;
        if (fr[i] && y > -1.45) {
          const x = r * sn[i];
          wm = whiteCoverage(x, y);
          if (wm > 0 && y > 0.3 && y < 0.9 && Math.abs(Math.abs(x) - 0.39) < 0.2) em = eyeCoverage(x, y);
        }
        let rch = K[0] + (Wt[0] - K[0]) * wm, gch = K[1] + (Wt[1] - K[1]) * wm, bch = K[2] + (Wt[2] - K[2]) * wm;
        rch = rch * (1 - em) + E[0] * em; gch = gch * (1 - em) + E[1] * em; bch = bch * (1 - em) + E[2] * em;
        d[o] = rch; d[o + 1] = gch; d[o + 2] = bch; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = maxAniso;
    return tex;
  }

  /* materiales */
  const bodyMat = new THREE.MeshPhysicalMaterial({ map: makeBodyTexture(), roughness: 0.50, metalness: 0, clearcoat: 0.38, clearcoatRoughness: 0.34, envMapIntensity: 0.35 });
  const blackMat = new THREE.MeshPhysicalMaterial({ color: C(0x15171d), roughness: 0.48, metalness: 0, clearcoat: 0.42, clearcoatRoughness: 0.30, envMapIntensity: 0.38 });
  const orangeMat = new THREE.MeshPhysicalMaterial({ color: C(0xff9418), roughness: 0.42, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.30, envMapIntensity: 0.35 });
  const mouthMat = new THREE.MeshStandardMaterial({ color: C(0xb81f3a), roughness: 0.6, side: THREE.BackSide });
  const tongueMat = new THREE.MeshStandardMaterial({ color: C(0xff7d90), roughness: 0.5 });

  /* cuerpo */
  const NSEG = 96, pts = [];
  for (let j = 0; j < NSEG; j++) {
    const p = profileAt(-Math.PI / 2 + Math.PI * j / (NSEG - 1));
    pts.push(new THREE.Vector2(Math.max(p[0], 1e-4), p[1]));
  }
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 160), bodyMat);
  body.scale.set(1, 1, BODY_Z);
  body.rotation.y = Math.PI;
  model.add(body);

  /* aletas */
  const sphere = new THREE.SphereGeometry(1, 40, 28);
  const wings = [];
  function makeWing(side) {
    const pivot = new THREE.Group();
    pivot.position.set(0.84 * side, 0.15, 0.04);

    m.scale.set(0.19, 0.47, 0.12); m.position.y = -0.37; pivot.add(m);

  }

  /* patas */
  const feet = [];
  function makeFoot(side) {
    const g = new THREE.Group();

function easeSeg(f, s, e) {
  const g = x => x * x * (2 - x);

}

const modal = $('#modal');
function openLetter() {
  hideBubble(); modal.classList.add('open'); letterChime();
  liveEl.textContent = 'Carta abierta para Karen.';
  setTimeout(() => { const c = $('#close'); if (c) c.focus(); }, 80);
}
function closeLetter(silent) {
  modal.classList.remove('open');
  if (!silent) {
    liveEl.textContent = 'Carta cerrada.';
    setTimeout(() => { const m = $('#mail'); if (m && !m.hidden) m.focus(); }, 80);
  }
}
$('#close').addEventListener('click', () => closeLetter(false));
modal.addEventListener('pointerdown', e => { if (e.target === modal) closeLetter(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeLetter(false); });

/* fotos (modo #editar) */
$('#file').addEventListener('change', e => {
  [...e.target.files].slice(0, Math.max(0, 12 - photos.length)).forEach(f => {
    const img = new Image(); img.onload = () => { photos.push(img); refreshPhotos(); }; img.src = URL.createObjectURL(f);
  });
  e.target.value = '';
});

/* ---------------- escáner: mantener el dedo ---------------- */
const scanner = $('#scanner'), ringP = $('#ringProg'), hint = $('#scanHint');
let hintHtml = '';
function setHint(html) { if (html !== hintHtml) { hintHtml = html; hint.innerHTML = html; } }
function setHold(v) { S.holding = v; scanner.classList.toggle('holding', v); }
scanner.addEventListener('pointerdown', e => { e.preventDefault(); if (S.phase !== 'scan') return; startAudio(); setHold(true); try { scanner.setPointerCapture(e.pointerId); } catch (_) {} });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => scanner.addEventListener(n, () => setHold(false)));
scanner.addEventListener('contextmenu', e => e.preventDefault());
scanner.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && S.phase === 'scan') { e.preventDefault(); startAudio(); setHold(true); } });
scanner.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') setHold(false); });
addEventListener('blur', () => setHold(false));
addEventListener('pointermove', e => { pointer.x = (e.clientX / innerWidth - 0.5) * 2; pointer.y = (e.clientY / innerHeight - 0.5) * 2; });

function recognized() {
  S.phase = 'form'; S.formT = 0; setHold(false); musicOn = true; tick = 0;
  setHint('Huella reconocida, Mi Mamacita Hermosa 🥰<small>Tu galaxia está naciendo…</small>');
  setTimeout(() => $('#scan').classList.add('gone'), 1400);
  try { navigator.vibrate && navigator.vibrate([40, 70, 40]); } catch (_) {}
  riseChime();
  if (ac) musicStep();
}

/* ---------------- cajita de música y sonidos suaves ---------------- */
let ac = null, master = null, muted = false, tick = 0, musicOn = false, scanOsc = null, scanGain = null;
const VOL = 0.17;

function makeIR(dur, decay) {
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

/* nota de cajita: fundamental y armónicos cristalinos con caída larga */
function bell(f, t0, dur, vol) {
  if (!ac || ac.state !== 'running') return;
  const g = ac.createGain(), peak = Math.max(0.0003, vol);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  [[1, 1], [2.01, 0.34], [3.02, 0.12], [4.97, 0.05]].forEach(([k, a]) => {
    if (f * k > 12000) return;
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * k; o.detune.value = (Math.random() - 0.5) * 5;
    og.gain.value = a; o.connect(og); og.connect(g);
    o.start(t0); o.stop(t0 + dur + 0.08);
  });
  g.connect(master);
}

/* progresión I–vi–IV–V en registro de cajita */
const PROG = [
  [523.25, 659.25, 783.99, 987.77],  /* Cmaj7 */
  [440.00, 523.25, 659.25, 783.99],  /* Am7   */
  [349.23, 440.00, 523.25, 659.25],  /* Fmaj7 */
  [392.00, 493.88, 587.33, 698.46]   /* G7    */
];
const PAT = [0, 2, 1, 3, -1, 2, 1, 0];
function musicStep() {
  if (!ac || ac.state !== 'running' || !musicOn) return;
  const t0 = ac.currentTime + 0.06, ch = PROG[Math.floor(tick / PAT.length) % PROG.length], step = tick % PAT.length;
  if (step === 0) {
    bell(ch[0] / 4, t0, 4.4, 0.045);
    bell(ch[0], t0, 2.8, 0.06);
  }
  const idx = PAT[step];
  if (idx >= 0) bell(ch[idx] * (step === 5 ? 2 : 1), t0, 1.9 + Math.random() * 0.5, step === 5 ? 0.03 : 0.075);
  if (step === 7 && Math.random() < 0.45) bell(ch[1] * 2, t0 + 0.22, 1.8, 0.022);
  tick++;
}

/* gestos cortos: avanzar, abrir la carta, explosión */
function tapNote() {
  if (!ac || ac.state !== 'running' || muted) return;
  const ch = PROG[Math.floor(tick / PAT.length) % PROG.length];
  bell(ch[2] * 2, ac.currentTime + 0.02, 1.1, 0.03);
}
function riseChime() {
  if (!ac || ac.state !== 'running') return;
  const t0 = ac.currentTime + 0.04;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, t0 + i * 0.1, 1.6, 0.07));
}
function letterChime() {
  if (!ac || ac.state !== 'running' || muted) return;
  const t0 = ac.currentTime + 0.04;
  [1046.5, 1318.51, 1567.98].forEach((f, i) => bell(f, t0 + i * 0.08, 2.0, 0.055));
}
function boomSound() {
  if (!ac || ac.state !== 'running' || muted) return;
  const t0 = ac.currentTime + 0.03;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(174.61, t0); o.frequency.exponentialRampToValueAtTime(43.65, t0 + 1.7);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.13, t0 + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 2);
  [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98].forEach((f, i) => bell(f, t0 + 0.12 + i * 0.09, 2.4, 0.035));
}

function startAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : VOL;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.3;
    master.connect(comp); comp.connect(ac.destination);
    const verb = ac.createConvolver(); verb.buffer = makeIR(2.4, 2.8);
    const wet = ac.createGain(); wet.gain.value = 0.24;
    master.connect(verb); verb.connect(wet); wet.connect(comp);
    setInterval(musicStep, 460);
    scanOsc = ac.createOscillator(); scanOsc.type = 'sine'; scanOsc.frequency.value = 170;
    scanGain = ac.createGain(); scanGain.gain.value = 0; scanOsc.connect(scanGain); scanGain.connect(master); scanOsc.start();
  } catch (_) { ac = null; }
}
$('#mute').addEventListener('click', () => {
  muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; $('#mute').setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar sonido');
  if (ac) master.gain.setTargetAtTime(muted ? 0 : VOL, ac.currentTime, 0.05);
  songEl.muted = muted;
});
document.addEventListener('visibilitychange', () => { if (ac) { if (document.hidden) ac.suspend(); else ac.resume(); } });

/* ---------------- bucle principal ---------------- */
let last = 0;
const headW = new THREE.Vector3(), prevPos = new THREE.Vector3(), guideDir = new THREE.Vector3(), flashEl = $('#flash');
function frame(ts) {
  const now = ts / 1000, dt = Math.min(0.05, now - (last || now)); last = now;
  const tdt = S.freeze ? 0 : dt;
  S.T += dt; const T = S.T, root = otter.root;

  /* --- fases --- */
  if (S.phase === 'scan') {
    S.prog = clamp(S.prog + (S.holding ? tdt / SCAN_HOLD : -tdt / 1.4), 0, 1);
    if (S.prog >= 1) recognized();
    const pct = Math.round(S.prog * 100);
    if (S.phase === 'scan') setHint(S.holding ? `Reconociendo huella… ${pct}%` : (S.prog > 0 ? 'Sigue presionando…' : 'Mantén presionado sobre la huella<small>Para entrar a tu galaxia</small>'));
    ringP.style.setProperty('--p', pct);
  }
  if (S.phase !== 'scan' && S.formT < FORM_T) S.formT = Math.min(FORM_T, S.formT + tdt);
  S.form = S.phase === 'scan' ? 0 : easeIO(S.formT / FORM_T);
  if (S.phase === 'form' || S.phase === 'intro' || S.phase === 'tour') S.galT += tdt;
  if ((S.phase === 'form' || S.phase === 'intro' || S.phase === 'tour') && S.form >= 0.42) S.otterOn = true;
  if (S.phase === 'form' && S.form >= 0.8) enterIntro();
  if (S.phase === 'intro' && intro) {
    intro.t += tdt;
    if (!intro.started && intro.t > 0.8) startIntro();
  }
  if (S.phase === 'boom' || S.phase === 'final') {
    if (S.phase === 'boom') {
      S.boomT = Math.min(BOOM_T, S.boomT + tdt);
      if (S.boomT >= BOOM_T) { S.phase = 'final'; S.finalT = 0; }
    } else {
      S.boomT = Math.max(0, S.boomT - tdt);
      S.finalT += tdt;
    }
    S.otterOn = false;
  }
  S.boom = clamp(S.boomT / BOOM_T, 0, 1);
  S.flash = S.phase === 'boom' ? (S.boomT < 0.15 ? S.boomT / 0.15 : Math.max(0, 1 - (S.boomT - 0.15) / 0.9)) * 0.85 : 0;
  flashEl.style.opacity = S.flash.toFixed(3);
  S.otterVis = clamp(S.otterVis + (S.otterOn ? tdt / 0.9 : -tdt * 4), 0, 1);
  setUI();

  /* --- uniformes --- */
  U.uTime.value = T; U.uGalTime.value = S.galT; U.uForm.value = S.form; U.uBoom.value = S.boom;
  U.uProg.value = S.prog; U.uScanY.value = Math.sin(T * 1.5) * 17.5;
  const ph = (T * 1.15) % 1, beat = 1 + 0.1 * Math.exp(-ph * 6) + 0.05 * Math.exp(-Math.abs(ph - 0.3) * 16);
  U_HEART.uBeat.value = beat; U_HEART.uYaw.value = Math.sin(T * 0.5) * 0.5;
  const vis = smooth(0.6, 1, S.form) * (1 - S.boom);
  heartGlow.scale.set(30 * beat, 30 * beat, 1); heartGlow.material.opacity = heartGlow.userData.base * vis;
  coreGlow.material.opacity = coreGlow.userData.base * vis;
  pinkLight.intensity = (1.1 + (beat - 1) * 6) * vis;

  /* --- frases y fotos --- */
  const sv = smooth(0.7, 0.95, S.form) * (1 - S.boom), nP = phraseSprites.length;
  const phraseDim = S.phase === 'intro' ? 0.28 : 1;
  phraseSprites.forEach((s, i) => {
    const a = i / nP * TAU + T * 0.1, r = 30;
    s.position.set(Math.cos(a) * r, Math.sin(a * 3 + i) * 2.4 + Math.cos(a) * 2.2, Math.sin(a) * r);
    s.material.opacity = clamp(1.25 - s.position.distanceTo(camera.position) / 105, 0.3, 1) * sv * phraseDim;
  });
  photoSprites.forEach((s, i) => {
    if (!photos.length) { s.material.opacity = 0; return; }
    const a = -(i / photoSprites.length * TAU) + T * 0.08, r = 19;
    s.position.set(Math.cos(a) * r, Math.sin(a * 2) * 1.4, Math.sin(a) * r);
    s.material.rotation = Math.sin(T * 0.8 + i * 1.7) * 0.07;
    s.material.opacity = clamp(1.25 - s.position.distanceTo(camera.position) / 90, 0.35, 1) * sv;
  });

  /* --- texto del globo (sin autoavance: todo espera un toque) --- */
  if (bub.show) {
    bub.typed = Math.min(bub.text.length, bub.typed + tdt * 40);
    const shown = bub.text.slice(0, Math.floor(bub.typed));
    if (sayEl.textContent !== shown) sayEl.textContent = shown;
  }

  /* --- pingüino --- */
  let pose = S.phase === 'intro' ? 'wave' : '', envOn = false, singing = false, songLevel = null;
  prevPos.copy(root.position);
  if (tour) {
    envOn = tour.envOn; pose = tour.singing ? 'sing' : tour.pose; singing = tour.singing;
    if (tour.state === 'fly') {
      const s = !!tour.stopAt[tour.seg] || tour.seg === 0, e = !!tour.stopAt[tour.seg + 1];
      tour.f += tdt / tour.durs[tour.seg];
      if (tour.f >= 1) {
        tour.seg++; tour.f = 0; root.position.copy(tour.pts[tour.seg]);
        if (tour.stopAt[tour.seg] !== undefined) beginDwell(tour.stopAt[tour.seg]);
        else if (tour.seg >= tour.n - 1) finishTour();
      } else posAt(tour.seg, easeSeg(tour.f, s, e), root.position);
    } else {
      root.position.copy(tour.pts[tour.seg]);
    }
    if (tour) tour.w = lerp(tour.w, tour.state === 'dwell' ? 1 : 0, damp(2.2, dt));
  }
  if (singing && songAnalyser && songBuf) {
    songAnalyser.getByteTimeDomainData(songBuf);
    let sum = 0;
    for (let i = 0; i < songBuf.length; i++) { const v = (songBuf[i] - 128) / 128; sum += v * v; }
    songLevel = clamp((Math.sqrt(sum / songBuf.length) - 0.012) * 6.5, 0, 1);
  }
  const showOtter = S.otterVis > 0.005;
  root.visible = showOtter;
  if (showOtter) {
    const ov = S.otterVis, back = 1 + 1.4 * Math.pow(ov - 1, 3) + 0.4 * Math.pow(ov - 1, 2);
    root.scale.setScalar(Math.max(0.001, ov < 1 ? back * ov : 1));
    const vel = V.c.copy(root.position).sub(prevPos).divideScalar(Math.max(dt, 1e-4));
    speedNow = lerp(speedNow, vel.length(), damp(6, dt));
    const introOn = S.phase === 'intro';
    const dwell = introOn || (!!tour && tour.state === 'dwell');
    if (dwell) { V.a.copy(camera.position).sub(root.position).setY(0); if (V.a.lengthSq() < 1e-4) V.a.set(0, 0, 1); quatLook(V.a.normalize(), qb); }
    else if (speedNow > 1.2) quatLook(V.a.copy(vel).normalize(), qb);
    else qb.copy(root.quaternion);
    root.quaternion.slerp(qb, damp(dwell ? 3.5 : 5, dt));
    guideDir.set(0, 0, 1).applyQuaternion(root.quaternion);
    guideKey.position.copy(root.position).addScaledVector(guideDir, 2.4); guideKey.position.y += 3.2;
    guideRim.position.copy(root.position).addScaledVector(guideDir, -2.0); guideRim.position.y += 2.2;
    guideKey.intensity = 0.62 * ov; guideRim.intensity = 0.55 * ov;
    V.a.set(0, 0, 1).applyQuaternion(root.quaternion);
    const hd = Math.atan2(V.a.x, V.a.z); let dh = hd - heading; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); heading = hd;
    yawRate = lerp(yawRate, clamp(dh / Math.max(dt, 1e-4), -3, 3), damp(5, dt));
    const wUp = dwell ? 1 : (tour ? tour.w : 0);
    otter.rig.rotation.x = otter.pitch(wUp);
    otter.rig.rotation.z = lerp(otter.rig.rotation.z, clamp(-yawRate * 0.22, -0.5, 0.5) * (1 - wUp), damp(5, dt));
    otter.rig.rotation.y = lerp(otter.rig.rotation.y, 0.08 * wUp, damp(3, dt));
    otter.update(dt, T, clamp(speedNow / 18, 0, 1), wUp, pose, envOn, singing, songLevel);
    trail.update(dt, V.c.set(0, 0, -1.25).applyQuaternion(root.quaternion).add(root.position), speedNow > 2 ? speedNow * 0.9 : 0);
  } else {
    trail.update(dt, root.position, 0);
    guideKey.intensity = guideRim.intensity = 0;
  }

  /* --- cámara --- */
  let desPos = V.c, desLook = V.b.set(0, 0, 0), camRate = 2.4;
  if (tour) {
    V.a.set(0, 0, 1).applyQuaternion(root.quaternion).setY(0).normalize();
    desPos = V.c.copy(root.position).addScaledVector(V.a, -8).add(V.up.clone().multiplyScalar(3.2));
    desPos.lerp(tour.stopCam, tour.w);
    desLook = V.b.copy(root.position).add(V.up.clone().multiplyScalar(0.4 + 1.6 * tour.w));
    camRate = tour.state === 'dwell' ? 2.2 : 3.2;
  } else if (S.phase === 'scan') {
    desPos.set(Math.sin(T * 0.4) * 0.8, Math.cos(T * 0.3) * 0.5, SCAN_Z); camRate = 4;
  } else if (S.phase === 'form') {
    const f = smooth(0, 0.62, S.form);
    desPos.set(0, 0, SCAN_Z).lerp(INTRO_CAM, f);
    desLook.set(0, 0, 0).lerp(INTRO_LOOK, f);
    camRate = 4.2;
  } else if (S.phase === 'intro') {
    desPos.copy(INTRO_CAM); desLook.copy(INTRO_LOOK); camRate = 2.4;
  } else if (S.phase === 'boom' || S.phase === 'final') {
    desPos.copy(OVERVIEW);
    camRate = S.phase === 'boom' ? 1.8 : 0.9;
  }
  cam.pos.lerp(desPos, damp(camRate, dt)); cam.look.lerp(desLook, damp(camRate + 0.6, dt));
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  guideFill.position.copy(camera.position); guideFill.position.y += 1.4;
  guideFill.intensity = 0.28 * S.otterVis;

  /* --- tono de escaneo --- */
  if (scanGain && ac) {
    scanGain.gain.setTargetAtTime(S.phase === 'scan' && !muted ? S.prog * 0.3 : 0, ac.currentTime, 0.08);
    scanOsc.frequency.setTargetAtTime(170 + S.prog * 480, ac.currentTime, 0.1);
  }

  /* --- globo sobre la cabeza --- */
  if (bub.show) {
    otter.head.getWorldPosition(headW); headW.y += 1.15; headW.project(camera);
    const W = innerWidth, H = innerHeight, bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let x = (headW.x * 0.5 + 0.5) * W, y = (-headW.y * 0.5 + 0.5) * H;
    if (headW.z > 1) { x = W / 2; y = H - 90; }
    const gut = 16 + bw / 2, lx = clamp(x, gut, W - gut), top = clamp(y, bh + 74, H - 18);
    bubble.style.transform = `translate(${lx - bw / 2}px, ${top - bh - 12}px)`;
    bubble.style.setProperty('--tx', clamp(x - (lx - bw / 2), 24, bw - 24) + 'px');
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* arranque */
resize(); addEventListener('resize', resize);
camera.position.copy(cam.pos); camera.lookAt(0, 0, 0);
setUI();
requestAnimationFrame(frame);

/* ayuda para pruebas */
window.__pinguino = {
  patch(o) { Object.assign(S, o); },
  begin() { if (S.phase === 'scan') { S.prog = 1; } },
  skipTo(k) {
    stopSong(false); closeLetter(true); hideBubble(); tour = null; intro = null;
    S.phase = k === 0 ? 'intro' : 'tour'; S.formT = FORM_T; S.form = 1; S.otterOn = true; S.otterVis = 1; S.galT = 1;
    $('#scan').classList.add('gone');
    otter.root.position.copy(INTRO_POS); otter.root.quaternion.identity();
    if (otter.reset) otter.reset();
    if (k === 0) {
      intro = { t: 1, msg: 0, started: true }; startIntro();
    } else {
      startTour();
      const idx = Object.keys(tour.stopAt).find(i => tour.stopAt[i] === k);
      if (idx === undefined) return;
      tour.seg = +idx; tour.f = 0; tour.state = 'fly'; tour.w = 0;
      otter.root.position.copy(tour.pts[tour.seg]); beginDwell(k);
    }
    uiKey = ''; setUI();
  },
  song() { startSong(); },
  endSong() { stopSong(true); },
  boom() { stopSong(false); closeLetter(true); finishTour(); },
  info() { return { phase: S.phase, form: +S.form.toFixed(2), boom: +S.boom.toFixed(2), final: +S.finalT.toFixed(2), prog: +S.prog.toFixed(2), mouth: +(otter.state.mouth || 0).toFixed(2), analyser: !!songAnalyser, pos: otter.root.position.toArray().map(v => +v.toFixed(1)), intro: intro && { msg: intro.msg, started: intro.started }, tour: tour && { seg: tour.seg, state: tour.state, stop: tour.stop, singing: tour.singing, songDone: tour.songDone } }; }
};
})();
