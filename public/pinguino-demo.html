<style>
/* ComposiciÃ³n: escenario 3D a la izquierda y controles a la derecha; en pantallas angostas el escenario va arriba y los controles debajo. */
:root{
  --bg:#EAF2F7; --panel:#FFFFFF; --field:#F3F8FB; --ink:#13212C; --muted:#52677A; --line:#D0DFE9;
  --stage-a:#FAFDFF; --stage-b:#C9DFEE; --chip:rgba(255,255,255,.78);

  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1620; --panel:#152230; --field:#0E1A25; --ink:#E6EFF5; --muted:#9BB0BF; --line:#233648;
    --stage-a:#25405A; --stage-b:#0E1A26; --chip:rgba(13,22,32,.72);
    --accent:#F59A3A; --accent-ink:#1C1204; --focus:#72BDEB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1620; --panel:#152230; --field:#0E1A25; --ink:#E6EFF5; --muted:#9BB0BF; --line:#233648;
  --stage-a:#25405A; --stage-b:#0E1A26; --chip:rgba(13,22,32,.72);
  --accent:#F59A3A; --accent-ink:#1C1204; --focus:#72BDEB; color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.5 var(--font-body);
  padding-block:24px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{
  max-width:1040px; margin-inline:auto; display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px 28px; align-items:start;
}
.top{grid-column:1/-1}
h1{font:600 clamp(1.7rem,4.6vw,2.4rem)/1.1 var(--font-display); margin:0 0 6px; text-wrap:balance}

.stage{
  position:relative; aspect-ratio:4/5; max-width:100%; overflow:hidden;
  border-radius:28px; border:1px solid var(--line);
  background:radial-gradient(90% 70% at 50% 28%,var(--stage-a) 0%,var(--stage-b) 100%);
  cursor:grab;
}

canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y}

  padding:4px 12px; border-radius:999px; white-space:nowrap; pointer-events:none;
}

  position:absolute; top:16px; left:16px; right:16px; width:fit-content; max-width:calc(100% - 32px); margin-inline:auto;
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  padding:10px 16px; border-radius:20px; font-size:.98rem; text-align:center;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; pointer-events:none;
}
.bubble[hidden]{display:none}
.stage.sin3d canvas,.stage.sin3d .hint{display:none}
.stage.sin3d::after{
  content:"Este navegador no puede mostrar grÃ¡ficos 3D."; position:absolute; inset:0;
  display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted);
}

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:20px;
  padding:20px; display:grid; gap:18px; min-width:0;
}
.field{display:grid; gap:6px; min-width:0}
label{font-weight:700; font-size:.9rem; letter-spacing:.01em}

textarea,select{
  width:100%; font:inherit; color:var(--ink); background:var(--field);
  border:1px solid var(--line); border-radius:12px; padding:10px 12px;
}

input[type=range]{width:100%; accent-color:var(--accent); min-height:32px}
.row2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px}
.actions{display:flex; flex-wrap:wrap; gap:12px}
.btn{
  font:700 1rem var(--font-body); min-height:46px; padding:10px 24px; border-radius:999px;
  border:1.5px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:transparent; color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

@media (max-width:840px){
  .wrap{grid-template-columns:minmax(0,1fr)}
}

<main class="wrap">
  <header class="top">
    <h1>PingÃ¼ino parlante</h1>
    <p>Escribe algo y mÃ­ralo decirlo. TambiÃ©n puedes subir un audio y el pico se mueve al ritmo de la voz.</p>
  </header>

  <section class="stage" id="escenario" aria-label="PingÃ¼ino en 3D">

      </div>
      <div class="field">
        <label for="tono">Tono<output id="tonoVal" for="tono">1.5</output></label>

<script src="vendor/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const stageEl=$('escenario'), canvas=$('lienzo'), bubble=$('burbuja'), estado=$('estado');
const texto=$('texto'), vozSel=$('voz'), tono=$('tono'), tonoVal=$('tonoVal');
const btnHablar=$('hablar'), btnSubir=$('subir'), archivo=$('archivo');

if(!window.THREE){ stageEl.classList.add('sin3d'); return; }
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true}); }
catch(e){ stageEl.classList.add('sin3d'); return; }

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping;
renderer.setClearColor(0x000000,0);

const C=hex=>new THREE.Color(hex).convertSRGBToLinear();
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ---------- Escena, cÃ¡mara y luces ---------- */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,0.8,0.1,60);
camera.position.set(0,0.15,9.3);
camera.lookAt(0,-0.05,0);

(function buildEnvironment(){
  const pm=new THREE.PMREMGenerator(renderer);
  const env=new THREE.Scene();
  const g=new THREE.SphereGeometry(20,32,16);
  const pos=g.attributes.position, col=new Float32Array(pos.count*3);
  const top=new THREE.Color(0.6,0.66,0.72), mid=new THREE.Color(0.45,0.52,0.6), bot=new THREE.Color(0.25,0.3,0.36);
  const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const t=pos.getY(i)/20;
    if(t>0) c.copy(mid).lerp(top,t); else c.copy(mid).lerp(bot,-t);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  env.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const softbox=(w,h,x,y,z,k)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(k,k,k),side:THREE.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); env.add(m);
  };
  softbox(10,8,-8,9,10,9); softbox(8,6,10,4,8,4); softbox(14,3,0,-6,-6,2); softbox(6,10,-10,2,-8,3.5);
  scene.environment=pm.fromScene(env,0.03).texture;
  pm.dispose();
})();

/* Luz total sobre la cara frontal cercana a 1.0 para que el naranja no se lave */
scene.add(new THREE.HemisphereLight(0xdceeff,0x8a9bb0,0.2));
const key=new THREE.DirectionalLight(0xffffff,0.75); key.position.set(3.5,5.5,6); scene.add(key);
const rim=new THREE.DirectionalLight(0xbfdcff,0.6); rim.position.set(-5,3,-4); scene.add(rim);
const fill=new THREE.DirectionalLight(0xfff1e0,0.2); fill.position.set(-4,1,5); scene.add(fill);

/* ---------- Forma del cuerpo ---------- */
const BODY_A=0.92, BODY_H=1.5, BODY_N=2.45, BODY_Z=0.88, GROUND=-1.585;

/* Superelipse: costados casi rectos, base un poco mÃ¡s ancha que la cabeza. th va de -PI/2 a PI/2. */
function profileAt(th){
  const c=Math.cos(th), s=Math.sin(th), e=2/BODY_N;
  const taper=1-0.07*s;
  return [BODY_A*taper*Math.pow(Math.abs(c),e), BODY_H*(s<0?-1:1)*Math.pow(Math.abs(s),e)];
}
function surfaceZ(y){
  let prev=null;
  for(let j=0;j<=400;j++){
    const p=profileAt(j/400*Math.PI/2);
    if(prev && prev[1]<=y && p[1]>=y){
      const t=(y-prev[1])/(p[1]-prev[1]);
      return (prev[0]+(p[0]-prev[0])*t)*BODY_Z;
    }
    prev=p;
  }
  return 0.7;
}

/* ---------- Textura del cuerpo: negro con barriga y cara blancas, ojos felices ---------- */
const SHAPES=[
  [0,-0.62,0.80,0.76],   /* barriga */
  [-0.37,0.70,0.38,0.52],/* lÃ³bulo izquierdo de la cara */
  [0.37,0.70,0.38,0.52], /* lÃ³bulo derecho de la cara */
  [0,0.36,0.64,0.30]     /* mejillas, unen los lÃ³bulos con la barriga */
];
function sdE(x,y,cx,cy,a,b){
  const nx=(x-cx)/a, ny=(y-cy)/b, k=Math.sqrt(nx*nx+ny*ny);
  const h=Math.sqrt((nx/a)*(nx/a)+(ny/b)*(ny/b));
  return h<1e-9?-Math.min(a,b):(k-1)*k/h;
}
const cov=(d,aa)=>d>=aa/2?0:(d<=-aa/2?1:0.5-d/aa);
function whiteCoverage(x,y){
  let d=1e9;
  for(let k=0;k<4;k++){ const s=SHAPES[k], v=sdE(x,y,s[0],s[1],s[2],s[3]); if(v<d) d=v; }
  return cov(d,0.012);
}
function eyeCoverage(x,y){
  const cx=x<0?-0.39:0.39, cy=0.565, R=0.13, lo=0.436, hi=Math.PI-0.436;
  const a=Math.atan2(y-cy,x-cx);
  const ca=a<lo?lo:(a>hi?hi:a);
  const w=0.013+0.012*Math.sin((ca-lo)/(hi-lo)*Math.PI);
  const dx=x-(cx+R*Math.cos(ca)), dy=y-(cy+R*Math.sin(ca));
  return cov(Math.sqrt(dx*dx+dy*dy)-w,0.008);
}
function makeBodyTexture(){
  const W=2048,H=1024;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(W,H), d=img.data;
  const K=[21,23,29], Wt=[249,252,254], E=[17,18,24];
  const rr=new Float32Array(H), yy=new Float32Array(H);
  for(let j=0;j<H;j++){ const v=1-(j+0.5)/H, p=profileAt(-Math.PI/2+Math.PI*v); rr[j]=p[0]; yy[j]=p[1]; }
  const sn=new Float32Array(W), fr=new Uint8Array(W);
  for(let i=0;i<W;i++){ const a=((i+0.5)/W-0.5)*2*Math.PI; sn[i]=Math.sin(a); fr[i]=Math.cos(a)>0?1:0; }
  for(let j=0;j<H;j++){
    const y=yy[j], r=rr[j];
    for(let i=0;i<W;i++){
      const o=(j*W+i)*4;
      let wm=0, em=0;
      if(fr[i] && y>-1.45){
        const x=r*sn[i];
        wm=whiteCoverage(x,y);
        if(wm>0 && y>0.3 && y<0.9 && Math.abs(Math.abs(x)-0.39)<0.2) em=eyeCoverage(x,y);
      }
      let rch=K[0]+(Wt[0]-K[0])*wm, gch=K[1]+(Wt[1]-K[1])*wm, bch=K[2]+(Wt[2]-K[2])*wm;
      rch=rch*(1-em)+E[0]*em; gch=gch*(1-em)+E[1]*em; bch=bch*(1-em)+E[2]*em;
      d[o]=rch; d[o+1]=gch; d[o+2]=bch; d[o+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.encoding=THREE.sRGBEncoding;
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* ---------- Materiales ---------- */
const bodyMat=new THREE.MeshPhysicalMaterial({map:makeBodyTexture(),roughness:0.45,metalness:0,clearcoat:0.5,clearcoatRoughness:0.3,envMapIntensity:0.5});
const blackMat=new THREE.MeshPhysicalMaterial({color:C(0x15171d),roughness:0.45,metalness:0,clearcoat:0.5,clearcoatRoughness:0.3,envMapIntensity:0.5});
const orangeMat=new THREE.MeshPhysicalMaterial({color:C(0xff9418),roughness:0.4,metalness:0,clearcoat:0.4,clearcoatRoughness:0.3,envMapIntensity:0.5});
const mouthMat=new THREE.MeshStandardMaterial({color:C(0xb81f3a),roughness:0.6,side:THREE.BackSide});
const tongueMat=new THREE.MeshStandardMaterial({color:C(0xff7d90),roughness:0.5});

/* ---------- Armado del modelo ---------- */
const root=new THREE.Group(); scene.add(root);
const squash=new THREE.Group(); squash.position.y=GROUND; root.add(squash);   /* escala desde los pies */
const model=new THREE.Group(); model.position.y=-GROUND; squash.add(model);

const sphere=new THREE.SphereGeometry(1,40,28);
const domeGeo=new THREE.SphereGeometry(1,40,20,0,Math.PI*2,0,Math.PI/2);
const bowlGeo=new THREE.SphereGeometry(1,40,20,0,Math.PI*2,Math.PI/2,Math.PI/2);

/* cuerpo */
const N=96, pts=[];
for(let j=0;j<N;j++){
  const p=profileAt(-Math.PI/2+Math.PI*j/(N-1));
  pts.push(new THREE.Vector2(Math.max(p[0],1e-4),p[1]));
}
const body=new THREE.Mesh(new THREE.LatheGeometry(pts,160),bodyMat);
body.scale.set(1,1,BODY_Z);
body.rotation.y=Math.PI;       /* la costura queda en la espalda */
model.add(body);

/* aletas */
const wings=[];
function makeWing(side){
  const pivot=new THREE.Group();
  pivot.position.set(0.84*side,0.15,0.04);
  const m=new THREE.Mesh(sphere,blackMat);
  m.scale.set(0.19,0.47,0.12); m.position.y=-0.37; pivot.add(m);
  pivot.userData={base:0.75*side,side:side};
  pivot.rotation.z=pivot.userData.base;
  model.add(pivot); wings.push(pivot);
}
makeWing(-1); makeWing(1);

/* patas */
function makeFoot(side){
  const g=new THREE.Group();
  g.position.set(0.46*side,-1.5,0.36); g.rotation.y=0.2*side;
  const sole=new THREE.Mesh(sphere,orangeMat); sole.scale.set(0.30,0.085,0.40); g.add(sole);
  [-1,0,1].forEach(k=>{
    const t=new THREE.Mesh(sphere,orangeMat);
    t.scale.set(0.105,0.075,0.12); t.position.set(k*0.17,-0.005,0.37-Math.abs(k)*0.05); g.add(t);
  });
  model.add(g);
}
makeFoot(-1); makeFoot(1);

/* pico: cÃºpula superior fija + mandÃ­bula inferior que gira */
const beak=new THREE.Group();
beak.position.set(0,0.47,surfaceZ(0.47)-0.05);
beak.rotation.x=0.14;
model.add(beak);
const upper=new THREE.Mesh(domeGeo,orangeMat); upper.scale.set(0.27,0.13,0.27); upper.position.z=0.18; beak.add(upper);
const upperIn=new THREE.Mesh(domeGeo,mouthMat); upperIn.scale.set(0.255,0.115,0.255); upperIn.position.z=0.18; beak.add(upperIn);
const jaw=new THREE.Group(); beak.add(jaw);
const lower=new THREE.Mesh(bowlGeo,orangeMat); lower.scale.set(0.235,0.09,0.22); lower.position.z=0.16; jaw.add(lower);
const lowerIn=new THREE.Mesh(bowlGeo,mouthMat); lowerIn.scale.set(0.22,0.08,0.205); lowerIn.position.z=0.16; jaw.add(lowerIn);
const tongue=new THREE.Mesh(sphere,tongueMat); tongue.scale.set(0.11,0.03,0.11); tongue.position.set(0,-0.03,0.13); jaw.add(tongue);
const JAW_REST=0.2, JAW_MAX=0.62;
jaw.rotation.x=JAW_REST;

/* sombra suave en el suelo */
(function(){
  const sc=document.createElement('canvas'); sc.width=sc.height=128;
  const sx=sc.getContext('2d'), gr=sx.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(10,20,35,0.42)'); gr.addColorStop(1,'rgba(10,20,35,0)');
  sx.fillStyle=gr; sx.fillRect(0,0,128,128);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(3.6,2.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2; sh.position.set(0,GROUND-0.005,0.1); scene.add(sh);
})();

/* ---------- TamaÃ±o ---------- */
function resize(){
  const w=stageEl.clientWidth, h=stageEl.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stageEl); else window.addEventListener('resize',resize);
resize();

/* ---------- Girar con el dedo o el mouse ---------- */
let yaw=0,pitch=0,tYaw=0,tPitch=0,drag=false,lx=0,ly=0,lastTouch=0;
canvas.addEventListener('pointerdown',e=>{
  drag=true; lx=e.clientX; ly=e.clientY;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  stageEl.classList.add('arrastrando');
});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  tYaw=clamp(tYaw+(e.clientX-lx)*0.012,-1.4,1.4);
  tPitch=clamp(tPitch+(e.clientY-ly)*0.006,-0.25,0.25);
  lx=e.clientX; ly=e.clientY; lastTouch=performance.now();
});
const endDrag=()=>{ drag=false; stageEl.classList.remove('arrastrando'); lastTouch=performance.now(); };
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

/* ---------- Audio y habla ---------- */
let actx=null, analyser=null, abuf=null;
let mode=null;          /* null | 'audio' (mide el volumen) | 'synth' (movimiento simulado) */
let token=0, burst=0, phase=0, forced=null;
const sources=[];

function setEstado(msg){ estado.textContent=msg; }
function showBubble(t){ bubble.textContent=t; bubble.hidden=false; }
function ensureAudio(){
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    actx=new AC();
    analyser=actx.createAnalyser(); analyser.fftSize=512; analyser.smoothingTimeConstant=0.3;
    abuf=new Uint8Array(analyser.fftSize);
    analyser.connect(actx.destination);
  }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function stopAll(){
  token++;
  if(window.speechSynthesis){ try{speechSynthesis.cancel();}catch(_){} }
  sources.splice(0).forEach(n=>{ try{n.stop(0);}catch(_){} });
  mode=null; bubble.hidden=true; btnHablar.textContent='Hablar';
}
function finish(tk){
  if(tk!==token) return;
  mode=null; bubble.hidden=true; btnHablar.textContent='Hablar'; setEstado('Listo.');
}
function begin(label){ btnHablar.textContent='Parar'; showBubble(label); }

function babble(text,tk){
  const ac=ensureAudio();
  if(!ac){
    mode='synth'; burst=1; setEstado('Este navegador no reproduce audio; solo muevo el pico.');
    setTimeout(()=>finish(tk),Math.max(1200,text.length*85)); return;
  }
  const step=0.085, scale=[0,2,4,7,9,12];
  let t=ac.currentTime+0.05;
  Array.from(text.toLowerCase()).slice(0,260).forEach(ch=>{
    if(/\s/.test(ch)){ t+=step*1.1; return; }
    if(/[.,;:!?Â¡Â¿]/.test(ch)){ t+=step*2.2; return; }
    if(!/[a-zÃ¡Ã©Ã­Ã³ÃºÃ¼Ã±]/.test(ch)) return;
    const semi=scale[ch.charCodeAt(0)%scale.length]+(/[aeiouÃ¡Ã©Ã­Ã³Ãº]/.test(ch)?5:0);
    const f=620*Math.pow(2,semi/12);
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.08,t+step*0.8);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+step*0.92);
    o.connect(g); g.connect(analyser); o.start(t); o.stop(t+step);
    sources.push(o); t+=step;
  });
  mode='audio'; setEstado('Parloteandoâ€¦');
  setTimeout(()=>finish(tk),Math.max(0,(t-ac.currentTime)*1000)+200);
}

function pickVoice(){
  const vs=speechSynthesis.getVoices()||[];
  const pref=['es-CO','es-MX','es-US','es-419','es-ES'];
  for(const p of pref){
    const v=vs.find(v=>v.lang&&v.lang.replace('_','-')===p);
    if(v) return v;
  }
  return vs.find(v=>v.lang&&v.lang.toLowerCase().indexOf('es')===0)||null;
}

function sayText(text){
  stopAll();
  const tk=token;
  begin(text);
  const canSpeak=vozSel.value==='voz' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  if(!canSpeak){ babble(text,tk); return; }
  let started=false;
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice();
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang='es-ES';
  u.pitch=parseFloat(tono.value)||1.5; u.rate=1.02;
  u.onstart=()=>{ if(tk!==token) return; started=true; mode='synth'; burst=1; setEstado('Hablandoâ€¦'); };
  u.onboundary=()=>{ burst=1; };
  u.onend=()=>finish(tk);
  u.onerror=()=>{ if(tk!==token) return; if(started) finish(tk); else babble(text,tk); };
  try{ speechSynthesis.speak(u); }catch(_){ babble(text,tk); return; }
  setTimeout(()=>{
    if(tk===token && !started){ try{speechSynthesis.cancel();}catch(_){} babble(text,tk); }
  },1800);
}

btnHablar.addEventListener('click',()=>{
  if(mode!==null || btnHablar.textContent==='Parar'){ stopAll(); setEstado('Listo.'); return; }
  const t=texto.value.trim();
  if(!t){ setEstado('Escribe algo para que lo diga.'); texto.focus(); return; }
  sayText(t);
});
texto.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); btnHablar.click(); } });
tono.addEventListener('input',()=>{ tonoVal.textContent=tono.value; });

btnSubir.addEventListener('click',()=>{ ensureAudio(); archivo.click(); });
archivo.addEventListener('change',async()=>{
  const f=archivo.files&&archivo.files[0];
  if(!f) return;
  if(f.size>20*1024*1024){ setEstado('Ese audio pesa mÃ¡s de 20 MB. Prueba con uno mÃ¡s corto.'); archivo.value=''; return; }
  const ac=ensureAudio();
  if(!ac){ setEstado('Este navegador no puede reproducir audio.'); archivo.value=''; return; }
  stopAll(); const tk=token;
  begin('â™ª '+f.name); setEstado('Preparando el audioâ€¦');
  try{
    const data=await f.arrayBuffer();
    const audio=await new Promise((res,rej)=>{ const p=ac.decodeAudioData(data,res,rej); if(p&&p.catch) p.catch(rej); });
    if(tk!==token) return;
    const src=ac.createBufferSource(); src.buffer=audio; src.connect(analyser);
    src.onended=()=>finish(tk);
    sources.push(src); src.start(); mode='audio'; setEstado('Reproduciendo tu audioâ€¦');
  }catch(_){
    if(tk===token){ stopAll(); setEstado('No pude leer ese audio. Prueba con un MP3, WAV u OGG.'); }
  }
  archivo.value='';
});

if(!('speechSynthesis' in window)){ vozSel.value='parloteo'; setEstado('Este navegador no tiene voz hablada; usarÃ© el parloteo.'); }
else if(speechSynthesis.getVoices) { try{ speechSynthesis.getVoices(); }catch(_){} }

/* ---------- AnimaciÃ³n ---------- */
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
let t=0, mouth=0, energy=0;
function frame(){
  const dt=Math.min(clock.getDelta(),0.05); t+=dt;

  let target=0;
  if(mode==='audio'){
    analyser.getByteTimeDomainData(abuf);
    let s=0; for(let i=0;i<abuf.length;i++){ const v=(abuf[i]-128)/128; s+=v*v; }
    target=Math.min(1,Math.sqrt(s/abuf.length)*5.5);
  }else if(mode==='synth'){
    burst=Math.max(0,burst-dt*3.2);
    phase+=dt*(12+3*Math.sin(t*2.1));
    target=(0.38+0.62*burst)*(0.5+0.5*Math.sin(phase));
  }
  if(forced!==null) target=forced;
  mouth+=(target-mouth)*Math.min(1,dt*(target>mouth?28:14));
  energy+=(((mode!==null||forced!==null)?1:0)-energy)*Math.min(1,dt*6);
  jaw.rotation.x=JAW_REST+mouth*(JAW_MAX-JAW_REST);

  const calm=reduced?0.25:1, breath=Math.sin(t*1.8);
  const sx=1-0.006*breath*calm-0.02*mouth;
  squash.scale.set(sx,1+0.012*breath*calm+0.035*mouth,sx);
  model.rotation.z=0.018*Math.sin(t*1.1)*calm+0.03*Math.sin(t*5.2)*energy;
  root.position.y=0.05*mouth;
  const flap=0.04*Math.sin(t*1.3)*calm+0.22*mouth+0.08*energy*Math.sin(t*9);
  wings.forEach(w=>{ w.rotation.z=w.userData.base+w.userData.side*flap; });

  if(!drag && performance.now()-lastTouch>1600){ tYaw*=1-Math.min(1,dt*2.2); tPitch*=1-Math.min(1,dt*2.2); }
  yaw+=(tYaw-yaw)*Math.min(1,dt*10); pitch+=(tPitch-pitch)*Math.min(1,dt*10);
  root.rotation.y=yaw+0.06*Math.sin(t*0.6)*calm; root.rotation.x=pitch;

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
window.__pingu={set:o=>{
  if('mouth' in o) forced=o.mouth;
  if('yaw' in o){ tYaw=yaw=o.yaw; lastTouch=1e12; }
  if('pitch' in o){ tPitch=pitch=o.pitch; lastTouch=1e12; }
}};
requestAnimationFrame(frame);
})();
</script>
