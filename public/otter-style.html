<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuti estilizada · prueba</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 90% at 50% 18%, #5b2b72 0%, #2a0f45 38%, #120720 68%, #05010b 100%);
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
  }
  #gl { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    width: min(96vw, 430px); z-index: 5;
  }
  #hud button {
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(24, 8, 38, .62);
    color: #ffe9f3; padding: 8px 12px; border-radius: 999px;
    font: 600 12px/1 ui-rounded, "Segoe UI", system-ui, sans-serif;
    backdrop-filter: blur(8px); cursor: pointer;
  }
  #hud button.on { background: #ff7fae; color: #2b0718; border-color: #ffb3cf; }
  #tag {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255, 226, 240, .8); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; z-index: 5; pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="Prueba de Nutria estilizada"></canvas>
<div id="tag">Nuti · estudio de estilo</div>
<div id="hud">
  <button data-pose="idle" class="on">Reposo</button>
  <button data-pose="wave">Saludar</button>
  <button data-pose="present">Sobre</button>
  <button data-pose="sing">Cantar</button>
  <button data-pose="walk">Caminar</button>
  <button data-view="three">3/4</button>
  <button data-view="front">Frente</button>
  <button data-view="side">Lado</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (lambda, dt) => 1 - Math.exp(-lambda * dt);

/* ---------------- renderer / escena ---------------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 120);

scene.add(new THREE.HemisphereLight(0xffe4f2, 0x2a1240, 0.36));
const key = new THREE.DirectionalLight(0xfff3e8, 0.72); key.position.set(3.5, 6, 5.5); scene.add(key);
const fill = new THREE.PointLight(0xff79b2, 0.24, 30, 2); fill.position.set(-4, 2.5, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xff9fce, 0.46); rim.position.set(-3, 5, -6); scene.add(rim);
const under = new THREE.PointLight(0xffc8a0, 0.10, 20, 2); under.position.set(0, -2, 2); scene.add(under);

/* ---------------- fondo: estrellas y resplandores ---------------- */
function radialTexture(inner, outer, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, inner); g.addColorStop(0.45, inner.replace(/[\d.]+\)$/, '0.25)')); g.addColorStop(1, outer);
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const glowTex = radialTexture('rgba(255,120,175,0.65)', 'rgba(255,120,175,0)', 256);
for (const [x, y, z, s, col, op] of [
  [0, 0.6, -5.5, 11, 0xff5e9c, 0.30],
  [3.2, 1.8, -7, 7, 0xffa1c8, 0.16],
  [-4.0, -1.4, -6, 8, 0x9b6bff, 0.18]
]) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending }));
  sp.position.set(x, y, z); sp.scale.set(s, s, 1); scene.add(sp);
}

const N = 520;
const starPos = new Float32Array(N * 3), starCol = new Float32Array(N * 3);
const palette = [new THREE.Color(0xffffff), new THREE.Color(0xffc6dd), new THREE.Color(0xd8b6ff), new THREE.Color(0xffe8c8)];
for (let i = 0; i < N; i++) {
  const r = 8 + Math.random() * 34, a = Math.random() * TAU, y = (Math.random() - 0.5) * 34;
  starPos[i * 3] = Math.cos(a) * r; starPos[i * 3 + 1] = y; starPos[i * 3 + 2] = Math.sin(a) * r - 10;
  const c = palette[(Math.random() * palette.length) | 0];
  starCol[i * 3] = c.r; starCol[i * 3 + 1] = c.g; starCol[i * 3 + 2] = c.b;
}
const stars = new THREE.Points(
  new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos, 3)).setAttribute('color', new THREE.BufferAttribute(starCol, 3)),
  new THREE.PointsMaterial({ size: 0.075, vertexColors: true, transparent: true, opacity: 0.85, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending })
);
scene.add(stars);

/* ---------------- materiales ---------------- */
function addRim(mat, strength = 0.13) {
  mat.onBeforeCompile = shader => {
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <dithering_fragment>',
      `#include <dithering_fragment>
       float _rim = pow(1.0 - clamp(dot(normalize(vNormal), normalize(vViewPosition)), 0.0, 1.0), 2.1);
       gl_FragColor.rgb += vec3(1.0, 0.60, 0.74) * _rim * ${strength.toFixed(3)};`
    );
  };
  mat.needsUpdate = true;
  return mat;
}
const furMat = addRim(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.74, metalness: 0 }));
const brownMat = addRim(new THREE.MeshStandardMaterial({ color: 0x91522c, roughness: 0.78, metalness: 0 }), 0.12);
const darkFurMat = addRim(new THREE.MeshStandardMaterial({ color: 0x6d3a1e, roughness: 0.80, metalness: 0 }), 0.10);
const lightFurMat = addRim(new THREE.MeshStandardMaterial({ color: 0xa9663b, roughness: 0.78, metalness: 0 }), 0.12);
const creamMat = addRim(new THREE.MeshStandardMaterial({ color: 0xf8e6c9, roughness: 0.85, metalness: 0 }), 0.08);
const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xf08aa8, roughness: 0.9, metalness: 0 });
const padMat = new THREE.MeshStandardMaterial({ color: 0xf29ab2, roughness: 0.85, metalness: 0 });
const noseMat = new THREE.MeshPhysicalMaterial({ color: 0x4a2226, roughness: 0.22, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x3a1b18, roughness: 0.8 });
const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x24110c, roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02 });
const irisMat = new THREE.MeshPhysicalMaterial({ color: 0x7a3d20, roughness: 0.18, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04 });
const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x080403, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02 });
const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const whiskerMat = new THREE.MeshBasicMaterial({ color: 0xfff4ea, transparent: true, opacity: 0.82, depthWrite: false });
const envelopeMat = new THREE.MeshStandardMaterial({ color: 0xffe4ee, roughness: 0.62, metalness: 0, emissive: 0x2a0814, emissiveIntensity: 0.5 });
const envelopeEdgeMat = new THREE.MeshStandardMaterial({ color: 0xd94f86, roughness: 0.6, metalness: 0, emissive: 0x2a0814, emissiveIntensity: 0.4 });
const heartMat = new THREE.MeshStandardMaterial({ color: 0xff5f95, roughness: 0.4, metalness: 0, emissive: 0xff2d6b, emissiveIntensity: 0.55 });

/* ---------------- geometría orgánica ---------------- */
const vTmp = new THREE.Vector3();
function deformed(rx, ry, rz, warp, seg = 48, rings = 36) {
  const g = new THREE.SphereGeometry(1, seg, rings);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    vTmp.fromBufferAttribute(p, i);
    if (warp) warp(vTmp);
    p.setXYZ(i, vTmp.x * rx, vTmp.y * ry, vTmp.z * rz);
  }
  g.computeVertexNormals();
  return g;
}
function paint(geo, fn) {
  const p = geo.attributes.position, colors = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    fn(p.getX(i), p.getY(i), p.getZ(i), c);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}
function capsuleGeo(radius, length, seg = 22) {
  const pts = [], half = Math.max(0.001, length / 2), cap = 10;
  for (let i = 0; i <= cap; i++) {
    const a = -Math.PI / 2 + (i / cap) * (Math.PI / 2);
    pts.push(new THREE.Vector2(Math.cos(a) * radius, -half + Math.sin(a) * radius));
  }
  for (let i = 0; i <= cap; i++) {
    const a = (i / cap) * (Math.PI / 2);
    pts.push(new THREE.Vector2(Math.cos(a) * radius, half + Math.sin(a) * radius));
  }
  return new THREE.LatheGeometry(pts, seg);
}
function taperedTube(curve, radiusFn, tubular = 30, radial = 12) {
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], idx = [];
  for (let i = 0; i <= tubular; i++) {
    const u = i / tubular, P = curve.getPointAt(u), r = radiusFn(u);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * TAU, sn = Math.sin(a), cs = Math.cos(a);
      pos.push(
        P.x + r * (cs * frames.normals[i].x + sn * frames.binormals[i].x),
        P.y + r * (cs * frames.normals[i].y + sn * frames.binormals[i].y),
        P.z + r * (cs * frames.normals[i].z + sn * frames.binormals[i].z)
      );
    }
  }
  for (let i = 0; i < tubular; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1, c = b + 1, d = a + 1;
    idx.push(a, b, d, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* ---------------- paleta ---------------- */
const FUR = new THREE.Color('#8f5028');
const FUR_DARK = new THREE.Color('#66351a');
const FUR_LIGHT = new THREE.Color('#a9663b');
const CREAM = new THREE.Color('#e9c99e');
const CREAM_SHADE = new THREE.Color('#d3ab7c');

/* ---------------- cuerpo ---------------- */
const bodyGeo = deformed(0.55, 0.74, 0.48, v => {
  const t = clamp((v.y + 1) / 2, 0, 1);
  const widen = 0.92 + 0.22 * Math.sin(Math.PI * Math.pow(t, 0.72)) - 0.10 * smooth(0.55, 1, t);
  v.x *= widen; v.z *= widen;
  v.z += 0.05 * Math.exp(-Math.pow(v.x / 0.45, 2) - Math.pow((v.y + 0.18) / 0.45, 2)) * smooth(-0.1, 0.7, v.z);
  if (v.y < -0.76) v.y = -0.76 + (v.y + 0.76) * 0.55;
});
paint(bodyGeo, (x, y, z, c) => {
  const nx = x / 0.55, ny = y / 0.74, nz = z / 0.48;
  const front = smooth(0.12, 0.55, nz);
  const belly = front * (1 - smooth(0.30, 0.68, Math.abs(nx))) * (1 - smooth(0.18, 0.66, ny)) * (1 - smooth(-0.74, -0.98, ny));
  const shade = smooth(0.15, 0.95, -nz) * 0.55 + smooth(0.35, 0.95, ny) * 0.16;
  c.copy(FUR).lerp(FUR_DARK, clamp(shade, 0, 0.68));
  c.lerp(CREAM, belly * 0.96);
  c.lerp(CREAM_SHADE, belly * smooth(0.0, -0.8, ny) * 0.35);
  c.offsetHSL(0, 0, (Math.random() - 0.5) * 0.006);
});

/* ---------------- cabeza ---------------- */
const headGeo = deformed(0.62, 0.56, 0.55, v => {
  const cheek = Math.exp(-Math.pow((Math.abs(v.x) - 0.55) / 0.28, 2) - Math.pow((v.y + 0.18) / 0.40, 2)) * smooth(-0.05, 0.55, v.z);
  v.x *= 1 + 0.09 * cheek;
  v.z *= 1 + 0.065 * cheek;
  const muzzle = Math.exp(-Math.pow(v.x / 0.30, 2) - Math.pow((v.y + 0.30) / 0.22, 2)) * smooth(0.05, 0.65, v.z);
  v.z += 0.13 * muzzle;
  v.y -= 0.022 * muzzle;
  if (v.y > 0.72) v.y = 0.72 + (v.y - 0.72) * 0.68;
});
paint(headGeo, (x, y, z, c) => {
  const nx = x / 0.62, ny = y / 0.56, nz = z / 0.55;
  const front = smooth(0.12, 0.58, nz);
  const lower = front * (1 - smooth(0.26, 0.66, Math.abs(nx))) * (1 - smooth(-0.06, 0.20, ny)) * (1 - smooth(-0.94, -0.72, ny));
  const browL = 1 - smooth(0.07, 0.18, Math.hypot(nx + 0.20, (ny - 0.27) * 0.72));
  const browR = 1 - smooth(0.07, 0.18, Math.hypot(nx - 0.20, (ny - 0.27) * 0.72));
  const face = Math.max(lower, front * Math.max(browL, browR) * 0.6);
  const shade = smooth(0.15, 0.95, -nz) * 0.52 + smooth(0.40, 0.98, ny) * 0.12;
  c.copy(FUR).lerp(FUR_DARK, clamp(shade, 0, 0.66));
  c.lerp(CREAM, face);
  c.lerp(CREAM_SHADE, face * smooth(0.05, -0.5, ny) * 0.28);
  c.offsetHSL(0, 0, (Math.random() - 0.5) * 0.006);
});

/* ---------------- construir a Nuti ---------------- */
function buildNuti() {
  const root = new THREE.Group();
  const rig = new THREE.Group(); root.add(rig);
  const body = new THREE.Group(); rig.add(body);

  const bodyMesh = new THREE.Mesh(bodyGeo, furMat); bodyMesh.position.set(0, -0.12, 0); bodyMesh.scale.set(1.06, 1, 1.03); body.add(bodyMesh);

  const head = new THREE.Group(); head.position.set(0, 0.98, 0.03); head.scale.setScalar(0.94); rig.add(head);
  head.add(new THREE.Mesh(headGeo, furMat));

  /* orejas */
  const ears = [];
  for (const s of [-1, 1]) {
    const ear = new THREE.Group();
    ear.position.set(s * 0.50, 0.38, 0.10);
    ear.rotation.y = s * 0.30; ear.rotation.z = -s * 0.18;
    const outer = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), brownMat);
    outer.scale.set(0.175, 0.185, 0.085);
    ear.add(outer);
    const inner = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), innerEarMat);
    inner.scale.set(0.108, 0.118, 0.040); inner.position.z = 0.058;
    ear.add(inner);
    head.add(ear); ears.push(ear);
  }

  /* ojos */
  const eyes = [];
  for (const s of [-1, 1]) {
    const eg = new THREE.Group();
    eg.position.set(s * 0.225, 0.035, 0.455);
    eg.rotation.y = s * 0.14;
    const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), eyeMat);
    ball.scale.set(0.148, 0.160, 0.125); eg.add(ball);
    const iris = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), irisMat);
    iris.scale.set(0.098, 0.103, 0.022); iris.position.z = 0.108; eg.add(iris);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), pupilMat);
    pupil.scale.set(0.058, 0.062, 0.012); pupil.position.z = 0.124; eg.add(pupil);
    const hi = new THREE.Mesh(new THREE.SphereGeometry(0.034, 16, 12), shineMat);
    hi.position.set(-0.042, 0.052, 0.138); eg.add(hi);
    const hi2 = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 8), shineMat);
    hi2.position.set(0.033, -0.022, 0.143); eg.add(hi2);
    head.add(eg); eyes.push(eg);
  }

  /* nariz */
  const nose = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), noseMat);
  nose.scale.set(0.095, 0.072, 0.060); nose.position.set(0, -0.260, 0.550); nose.rotation.x = -0.15;
  head.add(nose);
  const noseHi = new THREE.Mesh(new THREE.SphereGeometry(0.017, 12, 8), shineMat);
  noseHi.position.set(-0.023, -0.242, 0.598); head.add(noseHi);

  /* boca */
  const smileGeo = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.140, -0.320, 0.472),
    new THREE.Vector3(-0.072, -0.372, 0.494),
    new THREE.Vector3(0, -0.386, 0.502),
    new THREE.Vector3(0.072, -0.372, 0.494),
    new THREE.Vector3(0.140, -0.320, 0.472)
  ]), 20, 0.0075, 4, false), mouthMat);
  head.add(smileGeo);
  const philtrum = new THREE.Mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.075, 5), mouthMat);
  philtrum.position.set(0, -0.323, 0.520); head.add(philtrum);

  /* boca de canto */
  const singMouth = new THREE.Group(); singMouth.position.set(0, -0.372, 0.500); singMouth.visible = false; head.add(singMouth);
  const cavity = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), mouthMat);
  cavity.scale.set(0.075, 0.045, 0.03); singMouth.add(cavity);
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), new THREE.MeshStandardMaterial({ color: 0xe77a99, roughness: 0.6 }));
  tongue.scale.set(0.048, 0.024, 0.018); tongue.position.set(0, -0.012, 0.022); singMouth.add(tongue);

  /* mejillas rosadas */
  const blushTex = radialTexture('rgba(255,118,155,0.62)', 'rgba(255,118,155,0)', 128);
  for (const s of [-1, 1]) {
    const bl = new THREE.Sprite(new THREE.SpriteMaterial({ map: blushTex, transparent: true, opacity: 0.72, depthWrite: false, depthTest: true }));
    bl.position.set(s * 0.360, -0.110, 0.470); bl.scale.set(0.28, 0.21, 1); head.add(bl);
  }

  /* bigotes */
  for (const s of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const y0 = -0.20 - i * 0.045;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(s * 0.150, y0, 0.500),
        new THREE.Vector3(s * 0.31, y0 + 0.025 - i * 0.008, 0.455),
        new THREE.Vector3(s * 0.50, y0 + 0.055 - i * 0.02, 0.385)
      ]);
      head.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.0036, 3, false), whiskerMat));
    }
  }

  /* mechón */
  const tuftCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.03, 0.46, 0.10),
    new THREE.Vector3(-0.06, 0.55, 0.06),
    new THREE.Vector3(-0.01, 0.61, 0.02),
    new THREE.Vector3(0.06, 0.62, -0.02)
  ]);
  const tuft = new THREE.Mesh(new THREE.TubeGeometry(tuftCurve, 14, 0.030, 6, false), lightFurMat);
  head.add(tuft);
  const tuftTip = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 10), lightFurMat);
  tuftTip.position.set(0.06, 0.62, -0.02); head.add(tuftTip);

  /* flor detrás de la oreja */
  const flower = new THREE.Group(); flower.position.set(-0.54, 0.36, 0.26); flower.rotation.z = 0.55; flower.rotation.y = -0.22; head.add(flower);
  const petalMat = new THREE.MeshStandardMaterial({ color: 0xff9fc4, roughness: 0.7, emissive: 0x50162d, emissiveIntensity: 0.35 });
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * TAU;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), petalMat);
    petal.scale.set(0.055, 0.022, 0.085);
    petal.position.set(Math.cos(a) * 0.085, 0, Math.sin(a) * 0.085);
    petal.rotation.y = -a;
    flower.add(petal);
  }
  const fcenter = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 10), new THREE.MeshStandardMaterial({ color: 0xffd36e, roughness: 0.45, emissive: 0x6b3d00, emissiveIntensity: 0.6 }));
  fcenter.scale.y = 0.55; flower.add(fcenter);

  /* brazos */
  const arms = [];
  for (const s of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(s * 0.555, 0.30, 0.12); rig.add(arm);
    const upper = new THREE.Mesh(capsuleGeo(0.105, 0.08), brownMat); upper.position.y = -0.13; arm.add(upper);
    const elbow = new THREE.Group(); elbow.position.y = -0.255; arm.add(elbow);
    const fore = new THREE.Mesh(capsuleGeo(0.095, 0.055), brownMat); fore.position.y = -0.10; elbow.add(fore);
    const paw = new THREE.Group(); paw.position.y = -0.205; elbow.add(paw);
    const pawBall = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), darkFurMat);
    pawBall.scale.set(0.118, 0.108, 0.125); paw.add(pawBall);
    const pad = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), padMat);
    pad.scale.set(0.067, 0.050, 0.022); pad.position.set(0, -0.018, 0.112); paw.add(pad);
    for (let i = -1; i <= 1; i++) {
      const toe = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), padMat);
      toe.scale.set(0.022, 0.016, 0.012);
      toe.position.set(i * 0.038, 0.041, 0.108); paw.add(toe);
    }
    arm.userData = { side: s, elbow, paw };
    arms.push(arm);
  }

  /* patas */
  const legs = [];
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * 0.29, -0.55, 0.05); rig.add(leg);
    const thigh = new THREE.Mesh(capsuleGeo(0.155, 0.055), brownMat); thigh.position.y = -0.14; leg.add(thigh);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), brownMat);
    foot.scale.set(0.235, 0.125, 0.30); foot.position.set(0, -0.285, 0.16); leg.add(foot);
    for (let i = -1; i <= 1; i++) {
      const toe = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), padMat);
      toe.scale.set(0.036, 0.020, 0.046);
      toe.position.set(i * 0.062, -0.325, 0.415); leg.add(toe);
    }
    const footPad = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), padMat);
    footPad.scale.set(0.12, 0.018, 0.15); footPad.position.set(0, -0.355, 0.23); leg.add(footPad);
    leg.userData = { side: s };
    legs.push(leg);
  }

  /* cola */
  const tail = new THREE.Group(); tail.position.set(0, -0.38, -0.46); rig.add(tail);
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0.02),
    new THREE.Vector3(0.03, -0.01, -0.26),
    new THREE.Vector3(0.07, 0.05, -0.52),
    new THREE.Vector3(0.11, 0.13, -0.74),
    new THREE.Vector3(0.13, 0.20, -0.90)
  ]);
  const tailGeo = taperedTube(tailCurve, u => lerp(0.190, 0.055, Math.pow(u, 0.72)), 30, 14);
  paint(tailGeo, (x, y, z, c) => {
    const u = clamp(-z / 0.92, 0, 1);
    c.copy(FUR).lerp(FUR_DARK, 0.25 + u * 0.45);
    c.offsetHSL(0, 0, (Math.random() - 0.5) * 0.006);
  });
  const tailMesh = new THREE.Mesh(tailGeo, furMat); tail.add(tailMesh);
  const tailTip = new THREE.Mesh(new THREE.SphereGeometry(0.058, 14, 10), darkFurMat);
  tailTip.position.set(0.13, 0.20, -0.90); tail.add(tailTip);
  tail.rotation.x = 0.12;

  /* sobre */
  const envelope = new THREE.Group();
  envelope.position.set(0, -0.02, 0.49); envelope.rotation.x = -0.08; envelope.visible = false; rig.add(envelope);
  const eBack = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.56, 0.035), envelopeEdgeMat); envelope.add(eBack);
  const eFace = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.50, 0.04), envelopeMat); eFace.position.z = 0.022; envelope.add(eFace);
  const flapShape = new THREE.Shape();
  flapShape.moveTo(-0.375, 0.25); flapShape.lineTo(0.375, 0.25); flapShape.lineTo(0, -0.08); flapShape.closePath();
  const flap = new THREE.Mesh(new THREE.ExtrudeGeometry(flapShape, { depth: 0.012, bevelEnabled: false }), envelopeEdgeMat);
  flap.position.z = 0.045; envelope.add(flap);
  const heartShape = new THREE.Shape();
  heartShape.moveTo(0, -0.12);
  heartShape.bezierCurveTo(-0.18, 0.02, -0.12, 0.16, 0, 0.08);
  heartShape.bezierCurveTo(0.12, 0.16, 0.18, 0.02, 0, -0.12);
  const heart = new THREE.Mesh(new THREE.ShapeGeometry(heartShape), heartMat);
  heart.scale.setScalar(0.42); heart.position.set(0, -0.10, 0.055); envelope.add(heart);

  /* animación */
  const state = { pose: 'idle', nextBlink: 2.2, blinkStart: -1, nextEar: 3.4, earStart: -1, wave: 0, present: 0, sing: 0, walk: 0, env: 0 };
  const st = { aLx: 0.04, aLz: -0.12, aRx: 0.04, aRz: 0.12, eLx: 0.12, eRx: 0.12, aLz2: 0, aRz2: 0, legL: 0, legR: 0 };
  const _target = { aLx: 0.04, aLz: -0.12, aRx: 0.04, aRz: 0.12, eLx: 0.12, eRx: 0.12, legL: 0, legR: 0 };

  function update(dt, t) {
    const pose = state.pose;
    const idle = 0.5 + 0.5 * Math.cos(t * 0.8);
    rig.position.y = Math.sin(t * 1.55) * 0.028 + Math.sin(t * 0.7) * 0.012;
    rig.rotation.z = Math.sin(t * 0.75) * 0.018;
    body.scale.set(1 + Math.sin(t * 1.55 + 1.2) * 0.008, 1 + Math.sin(t * 1.55 + 1.2) * 0.012, 1);
    head.rotation.x = -0.02 + Math.sin(t * 1.2) * 0.025;
    head.rotation.y = Math.sin(t * 0.65) * 0.055 + (pose === 'wave' ? -0.08 : 0);
    head.rotation.z = Math.sin(t * 0.9) * 0.02;

    /* parpadeo */
    if (state.blinkStart < 0 && t >= state.nextBlink) { state.blinkStart = t; state.doubleBlink = Math.random() < 0.2; }
    let blink = 0;
    if (state.blinkStart >= 0) {
      const e = t - state.blinkStart;
      if (state.doubleBlink) {
        if (e < 0.1) blink = Math.sin((e / 0.1) * Math.PI);
        else if (e < 0.16) blink = 0.1;
        else if (e < 0.26) blink = Math.sin(((e - 0.16) / 0.1) * Math.PI);
      } else if (e < 0.16) blink = Math.sin((e / 0.16) * Math.PI);
      if (e >= (state.doubleBlink ? 0.26 : 0.16)) { state.blinkStart = -1; state.nextBlink = t + 2.6 + Math.random() * 3.4; }
    }
    eyes.forEach(e => { e.scale.y = 1 - blink * 0.92; });

    /* orejas */
    if (state.earStart < 0 && t >= state.nextEar) state.earStart = t;
    let earTw = 0;
    if (state.earStart >= 0) {
      const e = t - state.earStart;
      if (e < 0.24) earTw = Math.sin(e * 42) * Math.exp(-e * 11);
      else { state.earStart = -1; state.nextEar = t + 3.4 + Math.random() * 4.2; }
    }
    ears.forEach((e, i) => {
      const s = i ? 1 : -1;
      e.rotation.z = -s * 0.18 + earTw * 0.16 * s + Math.sin(t * 1.7 + i) * 0.012;
      e.rotation.x = Math.sin(t * 1.3 + i * 1.4) * 0.02;
    });

    /* transiciones de pose */
    const k = damp(7, dt);
    if (pose === 'wave') {
      _target.aRx = -1.65; _target.aRz = 0.16; _target.eRx = 0.95;
      _target.aLx = 0.04; _target.aLz = -0.12; _target.eLx = 0.14;
      _target.aRx += Math.sin(t * 7.0) * 0.10; _target.eRx += Math.sin(t * 7.0 + 0.8) * 0.18;
    } else if (pose === 'present') {
      _target.aLx = _target.aRx = -1.02; _target.aLz = -0.30; _target.aRz = 0.30;
      _target.eLx = _target.eRx = 0.38;
    } else if (pose === 'sing') {
      _target.aLx = -0.42; _target.aRx = -0.42; _target.aLz = -0.46; _target.aRz = 0.46;
      _target.eLx = _target.eRx = 0.25;
      _target.aLx += Math.sin(t * 2.2) * 0.10; _target.aRx -= Math.sin(t * 2.2) * 0.10;
    } else if (pose === 'walk') {
      _target.aLx = Math.sin(t * 4.0) * 0.35; _target.aRx = -Math.sin(t * 4.0) * 0.35;
      _target.aLz = -0.12; _target.aRz = 0.12; _target.eLx = _target.eRx = 0.16;
      _target.legL = Math.sin(t * 4.0) * 0.36; _target.legR = -Math.sin(t * 4.0) * 0.36;
    } else {
      _target.aLx = 0.04 + Math.sin(t * 1.3) * 0.035; _target.aRx = 0.04 - Math.sin(t * 1.3) * 0.035;
      _target.aLz = -0.12; _target.aRz = 0.12; _target.eLx = _target.eRx = 0.12 + Math.sin(t * 1.1) * 0.02;
      _target.legL = _target.legR = 0;
    }
    st.aLx = lerp(st.aLx, _target.aLx, k); st.aRx = lerp(st.aRx, _target.aRx, k);
    st.aLz = lerp(st.aLz, _target.aLz, k); st.aRz = lerp(st.aRz, _target.aRz, k);
    st.eLx = lerp(st.eLx, _target.eLx, k); st.eRx = lerp(st.eRx, _target.eRx, k);
    st.legL = lerp(st.legL, _target.legL, k); st.legR = lerp(st.legR, _target.legR, k);

    arms[0].rotation.set(st.aLx, 0, st.aLz);
    arms[1].rotation.set(st.aRx, 0, st.aRz);
    arms[0].userData.elbow.rotation.x = st.eLx;
    arms[1].userData.elbow.rotation.x = st.eRx;
    arms[0].userData.paw.rotation.z = pose === 'wave' ? Math.sin(t * 7.0) * 0.18 : 0;
    arms[1].userData.paw.rotation.z = pose === 'wave' ? -Math.sin(t * 7.0) * 0.18 : 0;
    legs[0].rotation.x = st.legL; legs[1].rotation.x = st.legR;
    tail.rotation.y = Math.sin(t * (2.0 + (pose === 'sing' ? 1.2 : 0))) * (0.28 + (pose === 'sing' ? 0.12 : 0));
    tail.rotation.x = 0.12 + Math.sin(t * 1.4) * 0.035;
    tail.rotation.z = Math.sin(t * 1.1) * 0.03;

    /* boca cantando */
    const sing = pose === 'sing' ? 1 : 0;
    state.sing = lerp(state.sing, sing, damp(5, dt));
    const open = state.sing * (0.35 + 0.65 * Math.abs(Math.sin(t * 7.2)));
    singMouth.visible = open > 0.04;
    singMouth.scale.set(1, 1, 0.3 + 0.7 * open);
    smileGeo.visible = open <= 0.04;
    philtrum.visible = open <= 0.04;

    /* sobre */
    const env = pose === 'present' ? 1 : 0;
    state.env = lerp(state.env, env, damp(4, dt));
    envelope.visible = state.env > 0.02;
    envelope.scale.setScalar(Math.max(0.001, state.env));
    envelope.position.y = -0.02 + Math.sin(t * 1.8) * 0.015;
    envelope.position.z = 0.49 + Math.sin(t * 1.2) * 0.012;
    envelope.rotation.z = Math.sin(t * 1.1) * 0.02;

    /* respiración del pecho */
    bodyMesh.scale.set(1 + Math.sin(t * 1.55 + 1.2) * 0.006, 1 + Math.sin(t * 1.55 + 1.2) * 0.009, 1);
  }

  return { root, rig, head, body, arms, legs, tail, eyes, ears, envelope, update, state };
}

const nuti = buildNuti();
scene.add(nuti.root);

/* ---------------- cámara y vistas ---------------- */
const views = {
  three: { p: [2.25, 1.05, 7.1], l: [0, 0.10, 0] },
  front: { p: [0, 0.95, 7.3], l: [0, 0.10, 0] },
  side: { p: [7.2, 0.95, 0.6], l: [0, 0.05, 0] },
  back: { p: [-2.25, 1.05, -7.1], l: [0, 0.10, 0] },
  close: { p: [1.15, 1.30, 4.45], l: [0, 0.85, 0] }
};
const camPos = new THREE.Vector3(...views.three.p);
const camLook = new THREE.Vector3(...views.three.l);
let camTarget = { p: new THREE.Vector3(...views.three.p), l: new THREE.Vector3(...views.three.l) };
camera.position.copy(camPos); camera.lookAt(camLook);

function setView(name, instant = false) {
  const v = views[name] || views.three;
  camTarget.p.set(...v.p); camTarget.l.set(...v.l);
  if (instant) { camera.position.copy(camTarget.p); camLook.copy(camTarget.l); camera.lookAt(camLook); }
}

const q = new URLSearchParams(location.search);
if (q.get('pose')) nuti.state.pose = q.get('pose');
if (q.get('view')) setView(q.get('view'), true);
if (q.get('hud') === '0') document.getElementById('hud').style.display = 'none';

/* ---------------- UI ---------------- */
document.querySelectorAll('#hud button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.pose) {
      nuti.state.pose = btn.dataset.pose;
      document.querySelectorAll('#hud button[data-pose]').forEach(b => b.classList.toggle('on', b === btn));
    }
    if (btn.dataset.view) setView(btn.dataset.view);
  });
});

/* ---------------- bucle ---------------- */
const clock = new THREE.Clock();
let T = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  T += dt;
  nuti.update(dt, T);
  camera.position.lerp(camTarget.p, damp(4.5, dt));
  camLook.lerp(camTarget.l, damp(4.5, dt));
  camera.lookAt(camLook);
  stars.rotation.y += dt * 0.006;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.__otter = {
  root: nuti.root, head: nuti.head, state: nuti.state,
  setPose(p) { nuti.state.pose = p; },
  setView(v, instant = true) { setView(v, instant); },
  info() { return { pose: nuti.state.pose, env: +nuti.state.env.toFixed(2), blink: +nuti.eyes[0].scale.y.toFixed(2), t: +T.toFixed(2) }; }
};

frame();
})();
</script>
